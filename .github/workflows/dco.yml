name: DCO

# Runs only on pull requests, where the PR's base and head name the commits
# to check. Commits reach main only through a PR, so main is not checked
# again (owner decision 2026-11-19: this used to be a CI job that showed as
# "skipped" on every push to main).
on:
  pull_request:

# Read-only (ADR 0008).
permissions:
  contents: read

concurrency:
  group: dco-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Every commit has Signed-off-by
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$c" | grep -q '^Signed-off-by: '; then
              echo "Missing Signed-off-by: $(git log -1 --format='%h %s' "$c")"
              missing=1
            fi
          done
          exit $missing
