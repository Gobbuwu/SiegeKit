name: TEMP route sweep on cgroup v2

# Temporary (PR #63, ADR 0052): runs the real-app route sweep measurement
# on GitHub's runners, which use cgroup v2, with rootful Docker and rootless
# Podman. Reads only. Removed before the PR merges.

on:
  push:
    branches: [claude/project-thread-gyw3gn]
    paths: [.github/workflows/tmp-sweep-cgroupv2.yml, .github/tmp-sweep/**]
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.27.4"

jobs:
  sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        engine: [docker, podman]
        app: [gt]
        rep: [1, 2]
    env:
      SW: ${{ github.workspace }}/../sw
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Work dir and tools
        run: |
          mkdir -p "$SW/spec"
          cp .github/tmp-sweep/* "$SW/"
          echo "SW=$(cd "$SW" && pwd)" >> "$GITHUB_ENV"
          cd "$SW" && npm init -y >/dev/null && npm install playwright@1.63.0 >/dev/null && npx playwright install --with-deps chromium >/dev/null
      - name: Environment
        run: |
          uname -a; stat -fc 'cgroup fs: %T' /sys/fs/cgroup; go version
          if [ "${{ matrix.engine }}" = docker ]; then docker version -f 'docker {{.Server.Version}}'; docker info -f 'rootless={{range .SecurityOptions}}{{.}} {{end}} cgroup={{.CgroupVersion}} driver={{.CgroupDriver}}'
          else podman version -f 'podman {{.Client.Version}}'; podman info -f 'rootless={{.Host.Security.Rootless}} cgroup={{.Host.CgroupsVersion}} manager={{.Host.CgroupManager}} net={{.Host.NetworkBackend}}'; id -u; fi
      - name: Specs
        run: |
          cd "$SW/spec"
          case "${{ matrix.app }}" in
          rc*) git clone -q https://github.com/RocketChat/Rocket.Chat-Open-API && git -C Rocket.Chat-Open-API checkout -q a9823b49b3164fead42345309f47020a9da60839
               test "$(sha256sum Rocket.Chat-Open-API/*.yaml | sha256sum | cut -c1-64)" = 505081fc78f678948a5b8638db8a89d16f199cd7db0525ab3e91942c7057fd63 ;;
          mm) git clone -q --depth 1 --branch v12.0.2 --filter=blob:none --sparse https://github.com/mattermost/mattermost mm && git -C mm sparse-checkout set api/v4/source
              (cd mm/api/v4/source && cat $(cat "$SW/mm-order.txt")) > mm-bundle.yaml
              test "$(sha256sum mm-bundle.yaml | cut -c1-64)" = ca0c35b653b0ed62b750c13d81667a23f796ecde485eab95c9189d31a3ae9a4d ;;
          esac
          ls -la
      - name: Sweep (${{ matrix.engine }}, ${{ matrix.app }})
        run: |
          cd "$SW"
          export NODE_PATH="$SW/node_modules"
          [ "${{ matrix.engine }}" = podman ] && export DK=podman
          case "${{ matrix.app }}" in
          rc6) bash rcround.sh 6.13.1 x ;;
          rc8) REC=rec-rc-ro.js bash rcround.sh 8.9.1 x ;;
          mm) bash mmround.sh x ;;
          gt) bash gtround.sh x ;;
          esac
      - name: Images, setup and results
        if: always()
        run: |
          cd "$SW"
          D=${{ matrix.engine }}
          $D ps -a --format '{{.Names}} {{.Image}} {{.Status}}' || true
          for i in $($D ps -aq); do $D inspect -f '{{.Name}} {{.Image}}' "$i"; done || true
          $D images --digests || true
          echo "== setup"; cat x-setup.txt 2>/dev/null || true
          for f in x-*.txt; do echo "== $f"; grep -E "PARSED|RSUMMARY|RFINDING|FAIL|panic|setup failed" "$f" || true; done
          echo "== replays with C or no login answering 2xx"; grep -h RREPLAY x-*.txt | grep -E 'C=2|N=2' | cut -c1-260 || true
          echo "== recording"; jq -r '.log.entries[] | "HAR \(.request.method) \(.request.url) \(.response.status) \(.response.content.size) \(.response.content.mimeType)"' x.har | cut -c1-200 || true
          echo "== all replays"; grep -h RREPLAY x-*.txt | cut -c1-200 || true
