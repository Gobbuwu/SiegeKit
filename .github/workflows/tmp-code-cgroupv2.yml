name: TEMP code-route sweep on cgroup v2

# Temporary (PR #64, ADR 0053): runs the real-app sweep of routes from server code measurement
# on GitHub's runners, which use cgroup v2, with rootful Docker and rootless
# Podman. Reads only. Removed before the PR merges.

on:
  push:
    branches: [claude/project-thread-wx2eyc]
    paths: [.github/workflows/tmp-code-cgroupv2.yml, .github/tmp-code/**]
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.27.4"

jobs:
  sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        engine: [docker, podman]
        app: [rc6, rc8, mm, gt]
    env:
      SW: ${{ github.workspace }}/../sw
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Work dir and tools
        run: |
          mkdir -p "$SW/spec"
          cp .github/tmp-code/* "$SW/"
          echo "SW=$(cd "$SW" && pwd)" >> "$GITHUB_ENV"
          cd "$SW" && npm init -y >/dev/null && npm install playwright@1.63.0 >/dev/null && npx playwright install --with-deps chromium >/dev/null
      - name: Environment
        run: |
          uname -a; stat -fc 'cgroup fs: %T' /sys/fs/cgroup; go version
          if [ "${{ matrix.engine }}" = docker ]; then docker version -f 'docker {{.Server.Version}}'; docker info -f 'rootless={{range .SecurityOptions}}{{.}} {{end}} cgroup={{.CgroupVersion}} driver={{.CgroupDriver}}'
          else podman version -f 'podman {{.Client.Version}}'; podman info -f 'rootless={{.Host.Security.Rootless}} cgroup={{.Host.CgroupsVersion}} manager={{.Host.CgroupManager}} net={{.Host.NetworkBackend}}'; id -u; fi
      - name: Server source
        run: |
          cd "$SW"
          case "${{ matrix.app }}" in
          rc6|rc8) tag=$([ "${{ matrix.app }}" = rc6 ] && echo 6.13.1 || echo 8.9.1)
               git clone -q --depth 1 --branch $tag --filter=blob:none --sparse https://github.com/RocketChat/Rocket.Chat src && git -C src sparse-checkout set apps/meteor ;;
          mm) git clone -q --depth 1 --branch v12.0.2 --filter=blob:none --sparse https://github.com/mattermost/mattermost src && git -C src sparse-checkout set server ;;
          gt) git clone -q --depth 1 --branch v1.24.6 https://github.com/go-gitea/gitea src ;;
          esac
          git -C src rev-parse HEAD
      - name: Sweep (${{ matrix.engine }}, ${{ matrix.app }})
        run: |
          cd "$SW"
          export NODE_PATH="$SW/node_modules"
          [ "${{ matrix.engine }}" = podman ] && export DK=podman
          bash round.sh ${{ matrix.app }}
      - name: Images, setup and results
        if: always()
        run: |
          cd "$SW"
          D=${{ matrix.engine }}
          $D ps -a --format '{{.Names}} {{.Image}} {{.Status}}' || true
          for i in $($D ps -aq); do $D inspect -f '{{.Name}} {{.Image}}' "$i"; done || true
          $D images --digests || true
          echo "== setup"; cat x-setup.txt 2>/dev/null || true
          echo "== replays with C or no login answering 2xx"; grep -h RREPLAY x-*.txt | grep -E 'C=2|N=2' | cut -c1-260 || true
          echo "== recording"; jq -r '.log.entries[] | "HAR \(.request.method) \(.request.url) \(.response.status) \(.response.content.size) \(.response.content.mimeType)"' x.har | cut -c1-200 || true
          echo "== all replays"; grep -h RREPLAY x-*.txt | cut -c1-200 || true
          echo "== summary (last, for the log tail)"; for f in x-*.txt; do echo "== $f"; grep -E "CODE|PARSED|RSUMMARY |RFINDING|FAIL|panic|setup failed" "$f" | cut -c1-200 || true; done
