name: Real-repo gate

# M1 gate: scanning real repositories must never crash, fail or time out.
# Each repository is pinned to a commit so results are reproducible.
# M2.4b (ADR 0023): a URL scan of OWASP Juice Shop, a known vulnerable app.
# ADR 0054: write replay (access-control-write) on Juice Shop and Gitea from
# Chromium recordings.
# ADR 0056: emails counted at Mailpit on Gitea. ADR 0057: reset, sign-up and
# code pages on Juice Shop from a Chromium recording. ADR 0059: the storage
# write test on the Firebase Storage emulator and a local Supabase Storage.
# ADR 0060: every job also runs on GitHub's ARM Linux runner (ubuntu-24.04-arm).
# ADR 0062: login checks on a Next.js app whose logins are Server Action
# forms calling Supabase Auth on the server.
# ADR 0063: the planted secrets of the owner's Porchlet run.
# ADR 0070: the Juice Shop URL scan behind a preview login, with the bypass
# header in SIEGEKIT_EXTRA_HEADERS.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC
  # Also on every change to code the gate runs. A list of packages missed
  # internal/authz, so #58 changed what access-control replays without the
  # Juice Shop gate running (2026-11-21); all Go code is listed instead.
  pull_request:
    paths:
      - .github/workflows/gate.yml
      - .github/gate/**
      - plugins/**
      - cmd/**
      - internal/**
      - go.mod
      - go.sum
      - testdata/known-answers/**

# Read-only (ADR 0008).
permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.4"

jobs:
  scan:
    name: Scan ${{ matrix.repo }} (${{ matrix.engine }}${{ matrix.os == 'ubuntu-24.04-arm' && ', arm64' || '' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      SIEGEKIT_ENGINE: ${{ matrix.engine }}
      EXPECT_ENGINE: ${{ matrix.engine == 'podman' && 'podman rootless' || 'docker rootful' }}
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        # Each repository's pinned commit is in its known-answer file,
        # testdata/known-answers/OWNER__NAME.json (ADR 0039).
        repo:
          - pallets/flask
          - psf/requests
          - encode/httpx
          - gin-gonic/gin
          - spf13/cobra
          - go-chi/chi
          - expressjs/express
          - OWASP/NodeGoat
          - juice-shop/juice-shop
          - digininja/DVWA
          - kubernetes/examples
          - terraform-aws-modules/terraform-aws-vpc
          - docker/awesome-compose
          - firebase/quickstart-js
          - vercel/nextjs-subscription-payments
          - fastapi/full-stack-fastapi-template
          - psf/black
          - caddyserver/caddy
          - pallets/click
          - bridgecrewio/terragoat
        # Both engines on the runner (ADR 0039); a result holds only for
        # the engine it ran on (ADR 0038).
        engine: [podman, docker]
        # GitHub's ARM Linux runner too (ADR 0060, owner 2026-11-23).
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      # Actions are pinned to full commit SHAs (ADR 0008). Tag shown for reference only.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Platform
        # The runner is the matrix's architecture (ADR 0060).
        run: test "$(uname -m)" = "${{ matrix.os == 'ubuntu-24.04-arm' && 'aarch64' || 'x86_64' }}"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Build
        run: go build -o "$RUNNER_TEMP/siegekit" ./cmd/siegekit
      - name: Fetch target at pinned commit
        env:
          REPO: ${{ matrix.repo }}
        run: |
          answers="testdata/known-answers/${REPO//\//__}.json"
          SHA="$(jq -r '.fixture | split("@")[1]' "$answers")"
          test "$(jq -r '.fixture | split("@")[0]' "$answers")" = "$REPO"
          echo "ANSWERS=$answers" >> "$GITHUB_ENV"
          dir="$RUNNER_TEMP/target"
          git init -q "$dir"
          git -C "$dir" fetch -q --depth 1 "https://github.com/$REPO.git" "$SHA"
          git -C "$dir" -c advice.detachedHead=false checkout -q FETCH_HEAD
          test "$(git -C "$dir" rev-parse HEAD)" = "$SHA"
      - name: Scan
        # Exit 0 (clean) or 3 (findings); 4 means a check failed or timed
        # out, anything else is an error or a crash. Exit 3 wins over 4, so
        # the report is checked too.
        run: |
          set +e
          "$RUNNER_TEMP/siegekit" scan --yes --update --no-save --report-dir "$RUNNER_TEMP/report" "$RUNNER_TEMP/target"
          code=$?
          set -e
          echo "exit code $code"
          # 4 is allowed only when the known answer lists a check as
          # failed: one that did part of its work and says what it left out
          # (ADR 0040). The Known answers step checks status, cause and reason.
          if [ "$code" -eq 4 ] && jq -e '[.checks[] | select(.status == "failed")] | length > 0' "$ANSWERS" > /dev/null; then code=0; fi
          if [ "$code" -ne 0 ] && [ "$code" -ne 3 ]; then exit 1; fi
          # The gate's results hold for this engine only (ADR 0038). Fail if
          # the runner's engine changes.
          jq -e --arg e "$EXPECT_ENGINE" '.environment.engine | (.name + (if .rootless then " rootless" else " rootful" end)) == $e' "$RUNNER_TEMP/report/report.json"
          # Belt and braces: every plugin ran, was skipped because the
          # repository has no files of its language, or failed as its known
          # answer says (ADR 0040).
          jq -e --slurpfile a "$ANSWERS" '[.plugins[] | select(.status != "ran" and (.status != "skipped" or .cause != "no-files") and (.status != "failed" or $a[0].checks[.id].status != "failed"))] | length == 0' "$RUNNER_TEMP/report/report.json"
      - name: Known answers
        if: ${{ !cancelled() }}
        # Every check must find what it is known to find on this commit, and
        # nothing new (ADR 0039). The run's own answer is printed, for review
        # when a pin changes.
        run: |
          set +e
          go run ./internal/knownanswers/check -answers "$ANSWERS" -report "$RUNNER_TEMP/report/report.json" -observed "$RUNNER_TEMP/observed.json"
          code=$?
          set -e
          echo "::group::Answer of this run"
          cat "$RUNNER_TEMP/observed.json"
          echo "::endgroup::"
          exit $code

  planted:
    # ADR 0063: the secret and dependency cases of the owner's Porchlet run,
    # in a repository .github/gate/planted/make.sh builds at run time, so
    # that no key is stored in SiegeKit's repository: a Supabase secret key
    # in the tree and one committed then deleted, a token only the
    # repository's .gitleaks.toml knows, a service_role JWT, publishable
    # keys, a committed .env, an ignored .env.local, and lodash (production)
    # and minimist (development) in package-lock.json.
    name: Planted secrets (${{ matrix.engine }}${{ matrix.os == 'ubuntu-24.04-arm' && ', arm64' || '' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      SIEGEKIT_ENGINE: ${{ matrix.engine }}
      EXPECT_ENGINE: ${{ matrix.engine == 'podman' && 'podman rootless' || 'docker rootful' }}
      ANSWERS: testdata/known-answers/planted-secrets.json
    strategy:
      fail-fast: false
      matrix:
        engine: [podman, docker]
        # GitHub's ARM Linux runner too (ADR 0060, owner 2026-11-23).
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Platform
        run: test "$(uname -m)" = "${{ matrix.os == 'ubuntu-24.04-arm' && 'aarch64' || 'x86_64' }}"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Build
        run: go build -o "$RUNNER_TEMP/siegekit" ./cmd/siegekit
      - name: Build the planted repository
        run: .github/gate/planted/make.sh "$RUNNER_TEMP/target"
      - name: Scan
        # Findings are planted, so exit 3 is the only right code.
        run: |
          set +e
          "$RUNNER_TEMP/siegekit" scan --yes --update --no-save --only gitleaks,gitleaks-history,dotenv-gitignore,trivy --report-dir "$RUNNER_TEMP/report" "$RUNNER_TEMP/target"
          code=$?
          set -e
          echo "exit code $code"
          test "$code" -eq 3
          r="$RUNNER_TEMP/report/report.json"
          jq -e --arg e "$EXPECT_ENGINE" '.environment.engine | (.name + (if .rootless then " rootless" else " rootful" end)) == $e' "$r"
          # Both Gitleaks scans name the repository's rules as their input (SK-1).
          jq -e '[.plugins[] | select(.id == "gitleaks" or .id == "gitleaks-history") | .input | startswith("the rules in the repository'"'"'s .gitleaks.toml and SiegeKit'"'"'s rules ")] == [true, true]' "$r"
          # Only the development dependency's finding says it is one (SK-3).
          jq -e '[.findings[] | select(.message | contains("This is a development dependency")) | .ruleId] | unique == ["CVE-2021-44906"]' "$r"
          # Only the ignored, never-committed .env.local is called git-ignored;
          # .env.production.local is ignored too but committed (ADR 0068).
          jq -e '[.findings[] | select(.message | endswith(" This file is git-ignored: not committed.")) | .location.uri] | unique == [".env.local"]' "$r"
      - name: Known answers
        if: ${{ !cancelled() }}
        run: |
          set +e
          go run ./internal/knownanswers/check -answers "$ANSWERS" -report "$RUNNER_TEMP/report/report.json" -observed "$RUNNER_TEMP/observed.json"
          code=$?
          set -e
          echo "::group::Answer of this run"
          cat "$RUNNER_TEMP/observed.json"
          echo "::endgroup::"
          exit $code

  web:
    # M2.4b (ADR 0023): URL scan of OWASP Juice Shop v20.4.0, a deliberately
    # vulnerable app, running on this runner's loopback (local mode). The
    # image is pinned to the multi-architecture index digest of tag v20.4.0,
    # resolved with `docker buildx imagetools inspect` on 2026-11-19.
    name: Scan OWASP Juice Shop by URL (${{ matrix.engine }}${{ matrix.os == 'ubuntu-24.04-arm' && ', arm64' || '' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        engine: [podman, docker]
        # GitHub's ARM Linux runner too (ADR 0060, owner 2026-11-23).
        os: [ubuntu-latest, ubuntu-24.04-arm]
    env:
      SIEGEKIT_ENGINE: ${{ matrix.engine }}
      EXPECT_ENGINE: ${{ matrix.engine == 'podman' && 'podman rootless' || 'docker rootful' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Platform
        # The runner is the matrix's architecture (ADR 0060).
        run: test "$(uname -m)" = "${{ matrix.os == 'ubuntu-24.04-arm' && 'aarch64' || 'x86_64' }}"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Build
        # Static, because the relay runs this binary in Alpine (ADR 0021).
        run: CGO_ENABLED=0 go build -o "$RUNNER_TEMP/siegekit" ./cmd/siegekit
      - name: Start Juice Shop
        run: |
          docker run -d --name juice-shop -p 127.0.0.1:3000:3000 \
            docker.io/bkimminich/juice-shop@sha256:9bbaecc41791f00b002bc65931cc5ff355fbdb941fa72b06558c18dace43197b
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:3000/ && exit 0
            sleep 2
          done
          docker logs juice-shop
          exit 1
      - name: Accounts for the access-control check
        # Three new accounts (ADR 0035; C, ADR 0051). The HAR is written by hand from 12 GET
        # requests A can make, with A's token as header and cookie, as a
        # browser recording would hold it, and A's JSON login (ADR 0047:
        # access-control replays only the GETs, zap-active attacks all 13);
        # B's and C's sessions go in files read by the next step. Juice Shop
        # has no space A shares with B, so C reads what B reads.
        run: |
          set -euo pipefail
          base=http://127.0.0.1:3000
          pw='Gate-access-control-1'
          for who in a b c; do
            curl -sf -o /dev/null -H 'Content-Type: application/json' \
              -d "{\"email\":\"gate-$who@siegekit.test\",\"password\":\"$pw\",\"passwordRepeat\":\"$pw\",\"securityQuestion\":{\"id\":1},\"securityAnswer\":\"x\"}" "$base/api/Users"
          done
          login() { curl -sf -H 'Content-Type: application/json' -d "{\"email\":\"gate-$1@siegekit.test\",\"password\":\"$pw\"}" "$base/rest/user/login"; }
          la=$(login a); lb=$(login b); lc=$(login c)
          ta=$(jq -r .authentication.token <<<"$la"); bid=$(jq -r .authentication.bid <<<"$la"); tb=$(jq -r .authentication.token <<<"$lb"); tc=$(jq -r .authentication.token <<<"$lc")
          uid=$(curl -sf -H "Cookie: token=$ta" "$base/rest/user/whoami" | jq -r .user.id)
          jq -n --arg base "$base" --arg t "$ta" --arg bid "$bid" --arg uid "$uid" --arg pw "$pw" '{log: {entries: (([
            "/rest/basket/\($bid)", "/api/Users/\($uid)", "/api/Users", "/api/Complaints", "/api/Cards", "/api/Addresss",
            "/rest/order-history", "/rest/wallet/balance", "/api/Products", "/rest/user/whoami", "/rest/memories/",
            "/rest/products/search?q=apple"
            ] | map({request: {method: "GET", url: ($base + .), headers: [{name: "Authorization", value: "Bearer \($t)"}, {name: "Cookie", value: "token=\($t)"}]}}))
            + [{request: {method: "POST", url: ($base + "/rest/user/login"), headers: [{name: "Content-Type", value: "application/json"}],
                postData: {mimeType: "application/json", text: ({email: "gate-a@siegekit.test", password: $pw} | tojson)}}}])}}' > "$RUNNER_TEMP/a.har"
          printf 'Authorization: Bearer %s\nCookie: token=%s\n' "$tb" "$tb" > "$RUNNER_TEMP/session-b"
          printf 'Authorization: Bearer %s\nCookie: token=%s\n' "$tc" "$tc" > "$RUNNER_TEMP/session-c"
          echo "A: user $uid, basket $bid"
          echo "A_USER=$uid" >> "$GITHUB_ENV"
          echo "A_BASKET=$bid" >> "$GITHUB_ENV"
      - name: Scan
        # --authorized-host stands for the owner's confirmation of the attack
        # scan on this runner's own app (ADR 0005); --yes does not count.
        # Exit 0 or 3 as above. ffuf and both ZAP and Nuclei plugins must run and
        # reach the app, and the passive checks must report the issues seen
        # in every local run on 2026-11-19: no Content-Security-Policy (ZAP rule 10038) and
        # a permissive CORS header (10098). Juice Shop serves no OpenAPI spec
        # at the 10 default paths (it answers them with HTML, measured
        # 2026-11-20) but serves one in its Swagger UI setup script,
        # /api-docs/swagger-ui-init.js (measured 2026-11-21): public-maps
        # must send its 11 GETs and report that spec, and schemathesis must
        # test it and report ST103 on POST /b2b/v2/orders (ADR 0046).
        # Juice Shop does not limit failed logins (20 logins for
        # jim@juice-sh.op all answered 401, measured 2026-11-20), so
        # login-throttle must send 21 logins, the first with jim's password
        # from Juice Shop's own seed data (data/static/users.yml;
        # answered 200, measured 2026-11-23; ADR 0062), and report
        # login-not-limited (ADR 0030). served-secrets must fetch the start page and the 8 files
        # it links (9 requests, measured 2026-11-20; ADR 0032), plus a
        # <file>.map for each of the 8, none of them a source map (17
        # requests, measured 2026-11-21; ADR 0046).
        # access-control must replay the 12 GET requests (48 sent: A, C, B
        # and no login), report exactly 4 reads by C, which B gets too: A's
        # basket and user record, the user list and the complaints, and the
        # password hashes /rest/memories/ gives anyone (measured 2026-11-20,
        # ADR 0035; with C 2026-11-22, ADR 0051).
        # Juice Shop's product search has no rate limit (20 requests all
        # answered 200 with no rate-limit header, measured 2026-11-20), so
        # rate-limit must send 20 requests and report rate-not-limited
        # (ADR 0036).
        # zap-active must get the recording's 13 requests and report SQL
        # injection (40018) on the product search and on the JSON login,
        # both confirmed by hand (2 of 2 local runs, 2026-11-21; ADR 0047).
        # It must not report 40045, which only SiegeKit's HAR caused
        # (ADR 0065).
        run: |
          # access-control asks a person at a terminal to type that accounts
          # A, B and C are test accounts (ADR 0035 item 11). The gate created
          # the accounts above, so it types the answer through a
          # pseudo-terminal (script), standing for the owner's confirmation
          # as --authorized-host does (ADR 0044, owner 2026-11-21).
          cat > "$RUNNER_TEMP/gate-scan.sh" <<'SH'
          #!/bin/bash
          exec "$RUNNER_TEMP/siegekit" scan --yes --authorized-host 127.0.0.1 --no-save --report-dir "$RUNNER_TEMP/report" \
            --login-url http://127.0.0.1:3000/rest/user/login --login-user jim@juice-sh.op \
            --login-body '{"email":"{user}","password":"{password}"}' \
            --har "$RUNNER_TEMP/a.har" --har-user gate-a@siegekit.test \
            --rate-limit-url 'http://127.0.0.1:3000/rest/products/search?q=apple' http://127.0.0.1:3000/
          SH
          chmod +x "$RUNNER_TEMP/gate-scan.sh"
          SIEGEKIT_SESSION_B="$(cat "$RUNNER_TEMP/session-b")"
          SIEGEKIT_SESSION_C="$(cat "$RUNNER_TEMP/session-c")"
          # jim's password, read from Juice Shop's own seed data so that
          # no password is written in this repository (ADR 0062).
          SIEGEKIT_LOGIN_PASSWORD="$(docker cp juice-shop:/juice-shop/data/static/users.yml - | tar -xO | sed -n "/^ *email: jim$/{n;s/^ *password: '\(.*\)'$/\1/p;q}")"
          test -n "$SIEGEKIT_LOGIN_PASSWORD"
          export SIEGEKIT_SESSION_B SIEGEKIT_SESSION_C SIEGEKIT_LOGIN_PASSWORD
          set +e
          printf 'test accounts\n' | script -qec "$RUNNER_TEMP/gate-scan.sh" "$RUNNER_TEMP/scan.log"
          code=$?
          set -e
          echo "exit code $code"
          if [ "$code" -ne 0 ] && [ "$code" -ne 3 ]; then exit 1; fi
          grep -q 'B (SIEGEKIT_SESSION_B) and C (SIEGEKIT_SESSION_C). Type "test accounts" to confirm' "$RUNNER_TEMP/scan.log"
          r="$RUNNER_TEMP/report/report.json"
          jq -e --arg e "$EXPECT_ENGINE" '.environment.engine | (.name + (if .rootless then " rootless" else " rootful" end)) == $e' "$r"
          jq '.plugins[] | {id, status, cause, reason, input, result, requests, refused, refusedTo, findings}' "$r"
          jq -e '[.plugins[] | select(.status == "ran" and .requests > 0) | .id] | sort == ["access-control", "ffuf", "login-throttle", "nuclei", "nuclei-default-login", "nuclei-intrusive", "public-maps", "rate-limit", "schemathesis", "served-secrets", "zap", "zap-active"]' "$r"
          jq -e '[.plugins[] | select(.id == "schemathesis" and .input == "OpenAPI spec http://127.0.0.1:3000/api-docs/swagger-ui-init.js (the spec in the Swagger UI setup script)")] | length == 1' "$r"
          jq -e '[.plugins[] | select(.id == "public-maps" and .requests == 11 and .result == "found 1 API spec(s) at 11 path(s) tried, and 0 source map(s) for 8 script(s) and style(s)")] | length == 1' "$r"
          jq -e '[.findings[] | select(.ruleId == "public-api-spec" and .severity == "low" and .location.uri == "http://127.0.0.1:3000/api-docs/swagger-ui-init.js")] | length == 1' "$r"
          jq -e '[.plugins[] | select(.id == "login-throttle" and .requests == 21 and .result == "no limit seen in 20 attempts, all answered 401; the right password answered 200")] | length == 1' "$r"
          jq -e '[.plugins[] | select(.id == "served-secrets" and .requests >= 9 and (.result | startswith("scanned ")) and (.result | contains("tried <file>.map for 8 file(s) naming no source map, 8 not one")))] | length == 1' "$r"
          jq -e '[.findings[] | select(.ruleId == "login-not-limited" and .location.uri == "http://127.0.0.1:3000/rest/user/login")] | length == 1' "$r"
          jq -e '[.plugins[] | select(.id == "access-control" and .requests == 48 and (.result | contains(": 4 readable by account C or B, 0 only by account B (low),")))] | length == 1' "$r"
          jq -e '[.plugins[] | select(.id == "zap-active" and .input == "13 recorded request(s) from a.har")] | length == 1' "$r"
          for u in /rest/products/search /rest/user/login; do
            jq -e --arg u "http://127.0.0.1:3000$u" '[.findings[] | select(.ruleId == "40018" and .severity == "high" and (.location.uri | startswith($u)))] | length > 0' "$r" > /dev/null || { echo "zap-active: no 40018 on $u"; exit 1; }
          done
          # 40045 (Spring4Shell) came only from requests the proxy answered
          # 400 after a recorded body without a Content-Length (ADR 0065).
          jq -e '[.findings[] | select(.ruleId == "40045")] | length == 0' "$r" > /dev/null || { echo "zap-active: 40045 is back (ADR 0065)"; exit 1; }
          jq -e '[.plugins[] | select(.id == "rate-limit" and .requests == 20 and .input == "GET http://127.0.0.1:3000/rest/products/search?q=apple")] | length == 1' "$r"
          jq -e '[.findings[] | select(.ruleId == "rate-not-limited" and .severity == "low" and .location.uri == "http://127.0.0.1:3000/rest/products/search")] | length == 1' "$r"
          jq -e --arg b "/rest/basket/$A_BASKET" --arg u "/api/Users/$A_USER" '[.findings[] | select(.ruleId == "cross-account-read") | .location.uri | ltrimstr("http://127.0.0.1:3000")] | sort == ([$b, $u, "/api/Users", "/api/Complaints"] | sort)' "$r"
          jq -e '[.findings[] | select(.ruleId == "cross-account-read") | .message | contains("answered account C (SIEGEKIT_SESSION_C") and contains("Account B got the same answer.")] | all and length == 4' "$r"
          jq -e '[.findings[] | select(.ruleId == "no-login-secret") | .location.uri] == ["http://127.0.0.1:3000/rest/memories/"]' "$r"
          for rule in 10038 10098; do
            jq -e --arg rule "$rule" '[.findings[] | select(.ruleId == $rule)] | length > 0' "$r" > /dev/null || { echo "ZAP rule $rule not reported"; exit 1; }
          done
      - name: Known answers
        if: ${{ !cancelled() }}
        # As for the repositories (ADR 0039). The checks above stay: they
        # also hold what the answer format does not (inputs, result text).
        run: |
          set +e
          go run ./internal/knownanswers/check -answers testdata/known-answers/juice-shop-url.json -report "$RUNNER_TEMP/report/report.json" -observed "$RUNNER_TEMP/observed.json"
          code=$?
          set -e
          echo "::group::Answer of this run"
          cat "$RUNNER_TEMP/observed.json"
          echo "::endgroup::"
          exit $code
      - name: Juice Shop log
        if: failure()
        run: docker logs juice-shop 2>&1 | tail -50

  headers:
    # ADR 0070 (issue #87): the same scan as the web job, with Juice Shop
    # behind a stand-in for Vercel Authentication (.github/gate/headers):
    # a request without the bypass header gets a 302 to a login page. With
    # the header in SIEGEKIT_EXTRA_HEADERS, every check must reach the app
    # and meet the web job's known answers, no request may reach the
    # stand-in without the header, and the secret must be in no output,
    # report, saved run or audit log.
    name: Scan Juice Shop behind a preview login (${{ matrix.engine }}${{ matrix.os == 'ubuntu-24.04-arm' && ', arm64' || '' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        engine: [podman, docker]
        os: [ubuntu-latest, ubuntu-24.04-arm]
    env:
      SIEGEKIT_ENGINE: ${{ matrix.engine }}
      EXPECT_ENGINE: ${{ matrix.engine == 'podman' && 'podman rootless' || 'docker rootful' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Platform
        # The runner is the matrix's architecture (ADR 0060).
        run: test "$(uname -m)" = "${{ matrix.os == 'ubuntu-24.04-arm' && 'aarch64' || 'x86_64' }}"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Build
        run: |
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/siegekit" ./cmd/siegekit
          go build -o "$RUNNER_TEMP/login-gate" ./.github/gate/headers
      - name: Start Juice Shop behind the login stand-in
        # Juice Shop on 3001; the stand-in on 3000, so the report's URLs are
        # the web job's. The secret is new each run and masked in the log.
        run: |
          docker run -d --name juice-shop -p 127.0.0.1:3001:3000 \
            docker.io/bkimminich/juice-shop@sha256:9bbaecc41791f00b002bc65931cc5ff355fbdb941fa72b06558c18dace43197b
          secret=$(openssl rand -hex 16)
          echo "::add-mask::$secret"
          printf '%s' "$secret" > "$RUNNER_TEMP/secret"
          GATE_BYPASS_SECRET="$secret" nohup "$RUNNER_TEMP/login-gate" -addr 127.0.0.1:3000 -app http://127.0.0.1:3001 -log "$RUNNER_TEMP/gate-requests.log" > "$RUNNER_TEMP/login-gate.out" 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:3001/ && break
            sleep 2
          done
          curl -sf -o /dev/null http://127.0.0.1:3001/
          # Without the header the stand-in answers the login redirect.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/)" = 302
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "X-Vercel-Protection-Bypass: $secret" http://127.0.0.1:3000/)" = 200
          : > "$RUNNER_TEMP/gate-requests.log"
      - name: Accounts for the access-control check
        # As in the web job; made on the app directly, recorded at 3000.
        run: |
          set -euo pipefail
          app=http://127.0.0.1:3001
          base=http://127.0.0.1:3000
          pw='Gate-access-control-1'
          for who in a b c; do
            curl -sf -o /dev/null -H 'Content-Type: application/json' \
              -d "{\"email\":\"gate-$who@siegekit.test\",\"password\":\"$pw\",\"passwordRepeat\":\"$pw\",\"securityQuestion\":{\"id\":1},\"securityAnswer\":\"x\"}" "$app/api/Users"
          done
          login() { curl -sf -H 'Content-Type: application/json' -d "{\"email\":\"gate-$1@siegekit.test\",\"password\":\"$pw\"}" "$app/rest/user/login"; }
          la=$(login a); lb=$(login b); lc=$(login c)
          ta=$(jq -r .authentication.token <<<"$la"); bid=$(jq -r .authentication.bid <<<"$la"); tb=$(jq -r .authentication.token <<<"$lb"); tc=$(jq -r .authentication.token <<<"$lc")
          uid=$(curl -sf -H "Cookie: token=$ta" "$app/rest/user/whoami" | jq -r .user.id)
          jq -n --arg base "$base" --arg t "$ta" --arg bid "$bid" --arg uid "$uid" --arg pw "$pw" '{log: {entries: (([
            "/rest/basket/\($bid)", "/api/Users/\($uid)", "/api/Users", "/api/Complaints", "/api/Cards", "/api/Addresss",
            "/rest/order-history", "/rest/wallet/balance", "/api/Products", "/rest/user/whoami", "/rest/memories/",
            "/rest/products/search?q=apple"
            ] | map({request: {method: "GET", url: ($base + .), headers: [{name: "Authorization", value: "Bearer \($t)"}, {name: "Cookie", value: "token=\($t)"}]}}))
            + [{request: {method: "POST", url: ($base + "/rest/user/login"), headers: [{name: "Content-Type", value: "application/json"}],
                postData: {mimeType: "application/json", text: ({email: "gate-a@siegekit.test", password: $pw} | tojson)}}}])}}' > "$RUNNER_TEMP/a.har"
          printf 'Authorization: Bearer %s\nCookie: token=%s\n' "$tb" "$tb" > "$RUNNER_TEMP/session-b"
          printf 'Authorization: Bearer %s\nCookie: token=%s\n' "$tc" "$tc" > "$RUNNER_TEMP/session-c"
          echo "A_USER=$uid" >> "$GITHUB_ENV"
          echo "A_BASKET=$bid" >> "$GITHUB_ENV"
      - name: Scan
        # The web job's command (without --no-save, so the saved run is
        # searched too) and its checks that every check ran and reached the
        # app; its findings are checked against the same known answers below.
        run: |
          cat > "$RUNNER_TEMP/gate-scan.sh" <<'SH'
          #!/bin/bash
          exec "$RUNNER_TEMP/siegekit" scan --yes --authorized-host 127.0.0.1 --report-dir "$RUNNER_TEMP/report" \
            --login-url http://127.0.0.1:3000/rest/user/login --login-user jim@juice-sh.op \
            --login-body '{"email":"{user}","password":"{password}"}' \
            --har "$RUNNER_TEMP/a.har" --har-user gate-a@siegekit.test \
            --rate-limit-url 'http://127.0.0.1:3000/rest/products/search?q=apple' http://127.0.0.1:3000/
          SH
          chmod +x "$RUNNER_TEMP/gate-scan.sh"
          SIEGEKIT_SESSION_B="$(cat "$RUNNER_TEMP/session-b")"
          SIEGEKIT_SESSION_C="$(cat "$RUNNER_TEMP/session-c")"
          SIEGEKIT_LOGIN_PASSWORD="$(docker cp juice-shop:/juice-shop/data/static/users.yml - | tar -xO | sed -n "/^ *email: jim$/{n;s/^ *password: '\(.*\)'$/\1/p;q}")"
          test -n "$SIEGEKIT_LOGIN_PASSWORD"
          SIEGEKIT_EXTRA_HEADERS="X-Vercel-Protection-Bypass: $(cat "$RUNNER_TEMP/secret")"
          export SIEGEKIT_SESSION_B SIEGEKIT_SESSION_C SIEGEKIT_LOGIN_PASSWORD SIEGEKIT_EXTRA_HEADERS
          set +e
          printf 'test accounts\n' | script -qec "$RUNNER_TEMP/gate-scan.sh" "$RUNNER_TEMP/scan.log"
          code=$?
          set -e
          echo "exit code $code"
          if [ "$code" -ne 0 ] && [ "$code" -ne 3 ]; then exit 1; fi
          grep -q 'Every request to http://127.0.0.1:3000 carries X-Vercel-Protection-Bypass from SIEGEKIT_EXTRA_HEADERS (values hidden' "$RUNNER_TEMP/scan.log"
          r="$RUNNER_TEMP/report/report.json"
          jq -e --arg e "$EXPECT_ENGINE" '.environment.engine | (.name + (if .rootless then " rootless" else " rootful" end)) == $e' "$r"
          jq '.plugins[] | {id, status, cause, reason, input, result, requests, refused, findings}' "$r"
          jq -e '[.plugins[] | select(.status == "ran" and .requests > 0) | .id] | sort == ["access-control", "ffuf", "login-throttle", "nuclei", "nuclei-default-login", "nuclei-intrusive", "public-maps", "rate-limit", "schemathesis", "served-secrets", "zap", "zap-active"]' "$r"
          jq -e '[.plugins[] | select(.id == "login-throttle" and .requests == 21 and .result == "no limit seen in 20 attempts, all answered 401; the right password answered 200")] | length == 1' "$r"
          jq -e '[.plugins[] | select(.id == "access-control" and .requests == 48 and (.result | contains(": 4 readable by account C or B, 0 only by account B (low),")))] | length == 1' "$r"
          jq -e '[.plugins[] | select(.id == "zap-active" and .input == "13 recorded request(s) from a.har")] | length == 1' "$r"
      - name: Every request carried the header
        # Each check's requests, the reachability GET and the spec probes
        # all reached the stand-in with the header; none without it.
        run: |
          yes=$(grep -c ' header=yes$' "$RUNNER_TEMP/gate-requests.log" || true)
          no=$(grep -c ' header=no$' "$RUNNER_TEMP/gate-requests.log" || true)
          sent=$(jq '[.plugins[].requests // 0] | add' "$RUNNER_TEMP/report/report.json")
          echo "requests at the stand-in: $yes with the header, $no without; the report counts $sent"
          test "$no" -eq 0
          test "$yes" -ge "$sent"
          test "$sent" -gt 1000
      - name: The secret is in no output
        # The reports, the terminal output and SiegeKit's data folder (audit
        # log, saved runs, tool data). Only SiegeKit's own folder: rootless
        # Podman keeps its image store beside it, with files grep cannot read.
        run: |
          d="$HOME/.local/share/siegekit"
          set +e
          grep -rlF -f "$RUNNER_TEMP/secret" "$RUNNER_TEMP/report" "$RUNNER_TEMP/scan.log" "$d"
          code=$?
          set -e
          test -s "$d/audit.log"
          jq -e 'select(.extraHeaders == ["X-Vercel-Protection-Bypass"])' "$d/audit.log"
          ls "$d"/runs/*.json
          # grep exits 1 when no file holds it.
          test "$code" -eq 1
      - name: Known answers
        if: ${{ !cancelled() }}
        # The web job's answers: the header changes nothing the checks find.
        run: |
          set +e
          go run ./internal/knownanswers/check -answers testdata/known-answers/juice-shop-url.json -report "$RUNNER_TEMP/report/report.json" -observed "$RUNNER_TEMP/observed.json"
          code=$?
          set -e
          echo "::group::Answer of this run"
          cat "$RUNNER_TEMP/observed.json"
          echo "::endgroup::"
          exit $code
      - name: Logs
        if: failure()
        run: |
          docker logs juice-shop 2>&1 | tail -50
          tail -n 20 "$RUNNER_TEMP/login-gate.out" "$RUNNER_TEMP/gate-requests.log"

  writes:
    # ADR 0054: access-control-write (ADR 0049) on real apps, from a real
    # Chromium recording of account A, against known answers. Juice Shop
    # v20.4.0 (the web job's image) has real write flaws between accounts;
    # Gitea 1.24.6's web UI has CSRF tokens, redirects after a write, and
    # an account B that may write (a collaborator) next to an outsider C.
    # The check runs in SiegeKit's own process and starts no container, so
    # the engine in the matrix is the one the app runs under.
    name: Write replay on ${{ matrix.app }} (app on ${{ matrix.engine }}${{ matrix.os == 'ubuntu-24.04-arm' && ', arm64' || '' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [juice-shop, gitea]
        engine: [podman, docker]
        # GitHub's ARM Linux runner too (ADR 0060, owner 2026-11-23).
        os: [ubuntu-latest, ubuntu-24.04-arm]
    env:
      APP_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Platform
        # The runner is the matrix's architecture (ADR 0060).
        run: test "$(uname -m)" = "${{ matrix.os == 'ubuntu-24.04-arm' && 'aarch64' || 'x86_64' }}"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Build
        run: CGO_ENABLED=0 go build -o "$RUNNER_TEMP/siegekit" ./cmd/siegekit
      - name: Recorder
        # Playwright 1.63.0 and its own Chromium build, pinned with their
        # integrity hashes in .github/gate/package-lock.json; install
        # scripts are not run. The runner's Node is used (Playwright needs
        # 20 or later).
        working-directory: .github/gate
        run: |
          node -e 'process.exit(Number(process.versions.node.split(".")[0]) >= 20 ? 0 : 1)'
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install chromium
      - name: Start the app
        # Images pinned to the digests measured on 2026-11-22 (Juice Shop:
        # the web job's; Gitea: docker.io/gitea/gitea:1.24.6).
        run: |
          set -euo pipefail
          if [ "$APP_ENGINE" = podman ]; then test "$(podman info --format '{{.Host.Security.Rootless}}')" = true; fi
          case "${{ matrix.app }}" in
            juice-shop)
              "$APP_ENGINE" run -d --name app -p 127.0.0.1:3000:3000 \
                docker.io/bkimminich/juice-shop@sha256:9bbaecc41791f00b002bc65931cc5ff355fbdb941fa72b06558c18dace43197b
              base=http://127.0.0.1:3000 ;;
            gitea)
              "$APP_ENGINE" run -d --name app -p 127.0.0.1:3001:3000 -e GITEA__security__INSTALL_LOCK=true \
                -e GITEA__database__DB_TYPE=sqlite3 -e GITEA__server__ROOT_URL=http://127.0.0.1:3001/ \
                docker.io/gitea/gitea@sha256:2edc102cbb636ae1ddac5fa0c715aa5b03079dee13ac6800b2cef6d4e912e718
              base=http://127.0.0.1:3001 ;;
          esac
          echo "BASE=$base" >> "$GITHUB_ENV"
          for i in $(seq 1 90); do
            curl -sf -o /dev/null "$base/" && exit 0
            sleep 2
          done
          "$APP_ENGINE" logs app
          exit 1
      - name: Accounts and A's recording
        # Juice Shop: three new accounts, logged in A, B, C in that order
        # (A's basket is 6), as in the web job. Gitea: alice owns the
        # private repository alice/priv with one issue, bob is a
        # collaborator with write access, carol is not (ADR 0051).
        run: |
          set -euo pipefail
          pw='Gate-access-control-1'
          case "${{ matrix.app }}" in
            juice-shop)
              for who in a b c; do
                curl -sf -o /dev/null -H 'Content-Type: application/json' \
                  -d "{\"email\":\"gate-$who@siegekit.test\",\"password\":\"$pw\",\"passwordRepeat\":\"$pw\",\"securityQuestion\":{\"id\":1},\"securityAnswer\":\"x\"}" "$BASE/api/Users"
              done
              login() { curl -sf -H 'Content-Type: application/json' -d "{\"email\":\"gate-$1@siegekit.test\",\"password\":\"$pw\"}" "$BASE/rest/user/login" | jq -r .authentication.token; }
              ta=$(login a); tb=$(login b); tc=$(login c)
              test -n "$ta"
              printf 'Authorization: Bearer %s\nCookie: token=%s\n' "$tb" "$tb" > "$RUNNER_TEMP/session-b"
              printf 'Authorization: Bearer %s\nCookie: token=%s\n' "$tc" "$tc" > "$RUNNER_TEMP/session-c"
              node .github/gate/record-juice-shop.js "$BASE" gate-a@siegekit.test "$pw" "$RUNNER_TEMP/a.har"
              echo "HAR_USER=gate-a@siegekit.test" >> "$GITHUB_ENV" ;;
            gitea)
              for u in alice bob carol; do
                "$APP_ENGINE" exec -u git app gitea admin user create --username "$u" --password "$pw" --email "$u@siegekit.test" --must-change-password=false
              done
              api() { curl -sf -u "alice:$pw" -H 'Content-Type: application/json' "$@" -o /dev/null; }
              api "$BASE/api/v1/user/repos" -d '{"name":"priv","private":true,"auto_init":true}'
              api -X PUT "$BASE/api/v1/repos/alice/priv/collaborators/bob" -d '{"permission":"write"}'
              api "$BASE/api/v1/repos/alice/priv/issues" -d '{"title":"seed issue","body":"secret"}'
              node .github/gate/record-gitea.js "$BASE" "$pw" "$RUNNER_TEMP/a.har" "$RUNNER_TEMP/session-b" "$RUNNER_TEMP/session-c"
              echo "HAR_USER=alice" >> "$GITHUB_ENV" ;;
          esac
      - name: Scan
        # Only access-control-write. It asks a person to type that the
        # accounts are test accounts and then "change test data" (ADR 0049
        # item 8); the gate made the accounts and the app, so it types both
        # through a pseudo-terminal (ADR 0044), as in the web job.
        run: |
          cat > "$RUNNER_TEMP/gate-scan.sh" <<SH
          #!/bin/bash
          exec "$RUNNER_TEMP/siegekit" scan --yes --authorized-host 127.0.0.1 --no-save --report-dir "$RUNNER_TEMP/report" \
            --only access-control-write --har "$RUNNER_TEMP/a.har" --har-user "$HAR_USER" --replay-writes "$BASE/"
          SH
          chmod +x "$RUNNER_TEMP/gate-scan.sh"
          SIEGEKIT_SESSION_B="$(cat "$RUNNER_TEMP/session-b")"
          SIEGEKIT_SESSION_C="$(cat "$RUNNER_TEMP/session-c")"
          export SIEGEKIT_SESSION_B SIEGEKIT_SESSION_C
          set +e
          printf 'test accounts\nchange test data\n' | script -qec "$RUNNER_TEMP/gate-scan.sh" "$RUNNER_TEMP/scan.log"
          code=$?
          set -e
          echo "exit code $code"
          if [ "$code" -ne 0 ] && [ "$code" -ne 3 ]; then exit 1; fi
          grep -q 'Type "change test data" to run them' "$RUNNER_TEMP/scan.log"
          r="$RUNNER_TEMP/report/report.json"
          jq '.plugins[] | {id, status, cause, reason, input, result, requests, findings}' "$r"
          # No container: the check ran in SiegeKit's own process.
          jq -e '.environment.engine == null and ([.plugins[] | select(.id == "access-control-write" and .status == "ran")] | length == 1)' "$r"
          # The app ran on the matrix's engine (rootless Podman or rootful Docker).
          test "$("$APP_ENGINE" inspect -f '{{.State.Running}}' app)" = true
          case "${{ matrix.app }}" in
            juice-shop)
              # Measured on 10 local runs (ADR 0054): 14 recorded writes and
              # 17 tried, accounts B and C, 6 high and 4 medium; A's 3
              # basket items sent again before each of the 3 checkout
              # replays (ADR 0049 item 2d); the browser's Socket.IO polling
              # request not replayed (ADR 0050).
              jq -e '[.plugins[] | select(.id == "access-control-write" and (.input | startswith("a.har, 14 write(s) recorded as account A, 17 tried on A'"'"'s objects; account B from SIEGEKIT_SESSION_B; account C from SIEGEKIT_SESSION_C")) and (.result | contains(": 6 high, 4 medium, 0 low")) and (.result | contains("9 of account A'"'"'s earlier recorded writes sent again first")) and (.result | contains("1 SockJS or Socket.IO polling requests")))] | length == 1' "$r" ;;
            gitea)
              # Measured (ADR 0051, ADR 0054): carol refused on every write,
              # bob's 3 allowed by design (low), every CSRF write sent with
              # the sender's own token.
              jq -e '[.plugins[] | select(.id == "access-control-write" and (.input | startswith("a.har, 3 write(s) recorded as account A, 2 tried on A'"'"'s objects")) and (.result | contains(": 0 high, 0 medium, 3 low")) and (.result | contains("3 write(s) were sent with the sender'"'"'s own CSRF token")))] | length == 1' "$r" ;;
          esac
      - name: Known answers
        if: ${{ !cancelled() }}
        run: |
          set +e
          go run ./internal/knownanswers/check -answers "testdata/known-answers/${{ matrix.app }}-writes.json" -report "$RUNNER_TEMP/report/report.json" -observed "$RUNNER_TEMP/observed.json"
          code=$?
          set -e
          echo "::group::Answer of this run"
          cat "$RUNNER_TEMP/observed.json"
          echo "::endgroup::"
          exit $code
      - name: App log
        if: failure()
        run: $APP_ENGINE logs app 2>&1 | tail -50

  mail:
    # ADR 0056: reset-limit and signup-limit count the emails the app sends
    # to a mail catcher (--mail-catcher). Gitea 1.24.6 answers every reset
    # the same but emails an account once in a few minutes, so its reset
    # counts as limited only from the count (design Q2 B); each sign-up
    # sends an activation email. The checks run in SiegeKit's own process,
    # so the engine in the matrix is the one the app and Mailpit run under.
    name: Mail count on Gitea (app on ${{ matrix.engine }}${{ matrix.os == 'ubuntu-24.04-arm' && ', arm64' || '' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [podman, docker]
        # GitHub's ARM Linux runner too (ADR 0060, owner 2026-11-23).
        os: [ubuntu-latest, ubuntu-24.04-arm]
    env:
      APP_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Platform
        # The runner is the matrix's architecture (ADR 0060).
        run: test "$(uname -m)" = "${{ matrix.os == 'ubuntu-24.04-arm' && 'aarch64' || 'x86_64' }}"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Build
        run: CGO_ENABLED=0 go build -o "$RUNNER_TEMP/siegekit" ./cmd/siegekit
      - name: Start Mailpit and Gitea
        # Images pinned to the digests measured on 2026-11-23 (Mailpit
        # v1.27.11, MIT; Gitea: the writes job's). Gitea sends its mail to
        # Mailpit over their own network; only Mailpit's web port and
        # Gitea's are published, on 127.0.0.1.
        run: |
          set -euo pipefail
          if [ "$APP_ENGINE" = podman ]; then test "$(podman info --format '{{.Host.Security.Rootless}}')" = true; fi
          "$APP_ENGINE" network create mail
          "$APP_ENGINE" run -d --name mailpit --network mail -p 127.0.0.1:8025:8025 \
            docker.io/axllent/mailpit@sha256:e22dce5b36f93c77082e204a3942fb6b283b7896e057458400a4c88344c3df68
          "$APP_ENGINE" run -d --name app --network mail -p 127.0.0.1:3001:3000 -e GITEA__security__INSTALL_LOCK=true \
            -e GITEA__database__DB_TYPE=sqlite3 -e GITEA__server__ROOT_URL=http://127.0.0.1:3001/ \
            -e GITEA__mailer__ENABLED=true -e GITEA__mailer__PROTOCOL=smtp -e GITEA__mailer__SMTP_ADDR=mailpit \
            -e GITEA__mailer__SMTP_PORT=1025 -e GITEA__mailer__FROM=gitea@siegekit.test -e GITEA__service__REGISTER_EMAIL_CONFIRM=true \
            docker.io/gitea/gitea@sha256:2edc102cbb636ae1ddac5fa0c715aa5b03079dee13ac6800b2cef6d4e912e718
          up=
          for i in $(seq 1 90); do
            if curl -sf -o /dev/null http://127.0.0.1:3001/ && curl -sf -o /dev/null http://127.0.0.1:8025/api/v1/info; then up=1; break; fi
            sleep 2
          done
          if [ -z "$up" ]; then "$APP_ENGINE" logs app; "$APP_ENGINE" logs mailpit; exit 1; fi
          "$APP_ENGINE" exec -u git app gitea admin user create --username alice --password 'Gate-mail-count-1' --email alice@siegekit.test --must-change-password=false
          # No email yet, so every one counted below came from the scan.
          test "$(curl -sf 'http://127.0.0.1:8025/api/v1/messages?limit=1' | jq .total)" = 0
      - name: Scan
        # --authorized-host stands for the typed yes (ADR 0023); the gate
        # made the app, the account and the mail catcher.
        run: |
          set +e
          "$RUNNER_TEMP/siegekit" scan --yes --authorized-host 127.0.0.1 --no-save --report-dir "$RUNNER_TEMP/report" \
            --only reset-limit,signup-limit --mail-catcher http://127.0.0.1:8025/ \
            --reset-url http://127.0.0.1:3001/user/forgot_password --reset-body 'email=alice%40siegekit.test' \
            --signup-url http://127.0.0.1:3001/user/sign_up \
            --signup-body 'user_name={new}&email={new}%40example.com&password=Gate-mail-count-1&retype=Gate-mail-count-1' \
            http://127.0.0.1:3001/
          code=$?
          set -e
          echo "exit code $code"
          if [ "$code" -ne 0 ] && [ "$code" -ne 3 ]; then exit 1; fi
          r="$RUNNER_TEMP/report/report.json"
          jq '.plugins[] | {id, status, cause, reason, input, result, requests, findings}' "$r"
          # Measured on Docker and rootless Podman (ADR 0056): 20 resets
          # answered 200 and 1 email arrived; 20 sign-ups and 20 emails.
          jq -e '[.plugins[] | select(.id == "reset-limit" and .findings == 0 and (.input | endswith("; emails counted at http://127.0.0.1:8025/ (Mailpit v1.27.11)")) and (.result == "no 429, 503 or rate-limit header in 20 requests, all answered 200, but only 1 email arrived at the mail catcher http://127.0.0.1:8025/ to the addresses sent for the 20 requests answered below 400: the app limits these emails"))] | length == 1' "$r"
          jq -e '[.plugins[] | select(.id == "signup-limit" and .findings == 1 and (.result | contains("; 20 emails arrived at the mail catcher http://127.0.0.1:8025/ to the addresses sent for 20 requests answered below 400")))] | length == 1' "$r"
          # The count again, read from Mailpit by the gate itself.
          curl -sf 'http://127.0.0.1:8025/api/v1/messages?limit=100' > "$RUNNER_TEMP/mail.json"
          jq -r '.messages[] | "\(.To[0].Address) \(.Subject)"' "$RUNNER_TEMP/mail.json" | sort | uniq -c
          test "$(jq '[.messages[] | select(.To[0].Address == "alice@siegekit.test")] | length' "$RUNNER_TEMP/mail.json")" = 1
          test "$(jq '[.messages[] | select(.To[0].Address | test("^siegekit-new-[a-z0-9]{12}@example\\.com$"))] | length' "$RUNNER_TEMP/mail.json")" = 20
          test "$(jq .total "$RUNNER_TEMP/mail.json")" = 21
      - name: Known answers
        if: ${{ !cancelled() }}
        run: |
          set +e
          go run ./internal/knownanswers/check -answers testdata/known-answers/gitea-mail.json -report "$RUNNER_TEMP/report/report.json" -observed "$RUNNER_TEMP/observed.json"
          code=$?
          set -e
          echo "::group::Answer of this run"
          cat "$RUNNER_TEMP/observed.json"
          echo "::endgroup::"
          exit $code
      - name: App log
        if: failure()
        run: |
          $APP_ENGINE logs app 2>&1 | tail -50
          $APP_ENGINE logs mailpit 2>&1 | tail -20

  pages:
    # ADR 0057: reset-limit, signup-limit and code-limit (ADR 0055) on Juice
    # Shop, with the pages found in a Chromium recording as a person would
    # make one: a sign-up, a password reset with the right security answer,
    # and a login with a second factor. Juice Shop limits its reset and code
    # pages (X-RateLimit-Limit 100 per 5 minutes) and not its sign-up. The
    # checks run in SiegeKit's own process, so the engine in the matrix is
    # the one the app runs under.
    name: Reset, sign-up and code pages on Juice Shop (app on ${{ matrix.engine }}${{ matrix.os == 'ubuntu-24.04-arm' && ', arm64' || '' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [podman, docker]
        # GitHub's ARM Linux runner too (ADR 0060, owner 2026-11-23).
        os: [ubuntu-latest, ubuntu-24.04-arm]
    env:
      APP_ENGINE: ${{ matrix.engine }}
      BASE: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Platform
        # The runner is the matrix's architecture (ADR 0060).
        run: test "$(uname -m)" = "${{ matrix.os == 'ubuntu-24.04-arm' && 'aarch64' || 'x86_64' }}"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Build
        run: CGO_ENABLED=0 go build -o "$RUNNER_TEMP/siegekit" ./cmd/siegekit
      - name: Recorder
        # As in the writes job.
        working-directory: .github/gate
        run: |
          node -e 'process.exit(Number(process.versions.node.split(".")[0]) >= 20 ? 0 : 1)'
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install chromium
      - name: Start Juice Shop
        # The web job's image.
        run: |
          set -euo pipefail
          if [ "$APP_ENGINE" = podman ]; then test "$(podman info --format '{{.Host.Security.Rootless}}')" = true; fi
          "$APP_ENGINE" run -d --name app -p 127.0.0.1:3000:3000 \
            docker.io/bkimminich/juice-shop@sha256:9bbaecc41791f00b002bc65931cc5ff355fbdb941fa72b06558c18dace43197b
          for i in $(seq 1 60); do
            curl -sf -o /dev/null "$BASE/" && exit 0
            sleep 2
          done
          "$APP_ENGINE" logs app
          exit 1
      - name: Recording
        # The recorded reset sets the new account's password to the second
        # one; the gate then changes it to a third, so that after the scan
        # the second one fails unless the scan sent the recorded answer and
        # new password again (ADR 0055 item 3).
        run: |
          set -euo pipefail
          node .github/gate/record-juice-shop-pages.js "$BASE" gate-r@siegekit.test Gate-pages-1 Gate-pages-2 "$RUNNER_TEMP/a.har"
          t=$(curl -sf -H 'Content-Type: application/json' -d '{"email":"gate-r@siegekit.test","password":"Gate-pages-2"}' "$BASE/rest/user/login" | jq -r .authentication.token)
          curl -sf -o /dev/null -H "Authorization: Bearer $t" "$BASE/rest/user/change-password?current=Gate-pages-2&new=Gate-pages-3&repeat=Gate-pages-3"
      - name: Scan
        # --authorized-host stands for the typed yes (ADR 0023); the gate
        # made the app, the recording and the account.
        run: |
          set +e
          "$RUNNER_TEMP/siegekit" scan --yes --authorized-host 127.0.0.1 --no-save --report-dir "$RUNNER_TEMP/report" \
            --only reset-limit,signup-limit,code-limit --har "$RUNNER_TEMP/a.har" "$BASE/"
          code=$?
          set -e
          echo "exit code $code"
          if [ "$code" -ne 0 ] && [ "$code" -ne 3 ]; then exit 1; fi
          r="$RUNNER_TEMP/report/report.json"
          jq '.plugins[] | {id, status, cause, reason, input, result, requests, findings}' "$r"
          # Measured (ADR 0057): the reset and code pages answer the first
          # request with X-RateLimit-Limit 100; 20 sign-ups answer 201.
          for page in reset-limit:/rest/user/reset-password code-limit:/rest/2fa/verify; do
            jq -e --arg id "${page%%:*}" --arg in "POST $BASE${page#*:} (recorded in a.har)" '[.plugins[] | select(.id == $id and .input == $in and .requests == 1 and (.result | startswith("limit seen after 1 of 20 requests: answered with a X-Ratelimit-Limit header, already at the first request (limit 100 per ")))] | length == 1' "$r"
          done
          jq -e --arg in "POST $BASE/api/Users/ (recorded in a.har)" '[.plugins[] | select(.id == "signup-limit" and .input == $in and .requests == 20 and .result == "no limit seen in 20 requests, all answered 201 with no rate-limit header; 20 answered below 400, so up to 20 accounts were made, named siegekit-new-...")] | length == 1' "$r"
          jq -e '[.findings[] | select(.ruleId == "code-limit-high" and .severity == "low")] | length == 1' "$r"
          jq -e '[.findings[] | select(.ruleId == "signup-not-limited" and .severity == "low")] | length == 1' "$r"
          # The app again, read by the gate itself: 20 new accounts, and the
          # recorded account's password is still the one the gate set.
          login() { curl -s -o "$RUNNER_TEMP/login.json" -w '%{http_code}' -H 'Content-Type: application/json' -d "{\"email\":\"gate-r@siegekit.test\",\"password\":\"$1\"}" "$BASE/rest/user/login"; }
          test "$(login Gate-pages-2)" = 401
          test "$(login Gate-pages-3)" = 200
          t=$(jq -r .authentication.token "$RUNNER_TEMP/login.json")
          test "$(curl -sf -H "Authorization: Bearer $t" "$BASE/api/Users" | jq '[.data[] | select(.email | test("^siegekit-new-[a-z0-9]{12}@example\\.com$"))] | length')" = 20
      - name: Known answers
        if: ${{ !cancelled() }}
        run: |
          set +e
          go run ./internal/knownanswers/check -answers testdata/known-answers/juice-shop-pages.json -report "$RUNNER_TEMP/report/report.json" -observed "$RUNNER_TEMP/observed.json"
          code=$?
          set -e
          echo "::group::Answer of this run"
          cat "$RUNNER_TEMP/observed.json"
          echo "::endgroup::"
          exit $code
      - name: App log
        if: failure()
        run: $APP_ENGINE logs app 2>&1 | tail -50

  storage:
    # ADR 0059: the storage write test (ADR 0058) against the Firebase
    # Storage emulator and a local Supabase Storage, 7 rule or policy sets
    # each, with the storage on the matrix's engine. The check runs in
    # SiegeKit's own process. gate.sh checks each run against its known
    # answer and its measured result (.github/gate/storage/results.txt), and
    # that the files left behind in the storage are exactly the ones the
    # report names. ADR 0061: the Supabase jobs also scan an app that calls
    # Supabase only from its server, behind Supabase's self-hosted gateway.
    name: Storage write on ${{ matrix.backend }} (storage on ${{ matrix.engine }}${{ matrix.os == 'ubuntu-24.04-arm' && ', arm64' || '' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        backend: [firebase, supabase]
        engine: [podman, docker]
        # GitHub's ARM Linux runner too (ADR 0060, owner 2026-11-23).
        os: [ubuntu-latest, ubuntu-24.04-arm]
    env:
      BACKEND: ${{ matrix.backend }}
      APP_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Platform
        # The runner is the matrix's architecture (ADR 0060).
        run: test "$(uname -m)" = "${{ matrix.os == 'ubuntu-24.04-arm' && 'aarch64' || 'x86_64' }}"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Build
        run: CGO_ENABLED=0 go build -o "$RUNNER_TEMP/siegekit" ./cmd/siegekit
      - name: Emulator and app tools
        # Pinned in package-lock.json: firebase-tools, the firebase and
        # supabase-js SDKs the apps are built from, and esbuild.
        working-directory: .github/gate/storage
        run: |
          node -e 'process.exit(Number(process.versions.node.split(".")[0]) >= 20 ? 0 : 1)'
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Start the storage and the app
        run: SK="$RUNNER_TEMP/siegekit" W="$RUNNER_TEMP/storage" REPO="$GITHUB_WORKSPACE" .github/gate/storage/gate.sh start
      - name: Scan each rule set
        run: SK="$RUNNER_TEMP/siegekit" W="$RUNNER_TEMP/storage" REPO="$GITHUB_WORKSPACE" .github/gate/storage/gate.sh scan
      - name: Storage log
        if: failure()
        run: SK="$RUNNER_TEMP/siegekit" W="$RUNNER_TEMP/storage" REPO="$GITHUB_WORKSPACE" .github/gate/storage/gate.sh logs

  logins:
    # ADR 0062: login-throttle and login-spray on a Next.js 16 app whose
    # logins are Server Action forms calling Supabase Auth on the server
    # (Supabase's server-side login guide pattern, and a useActionState
    # form), with Supabase Auth and its database on the matrix's engine and
    # the app on the runner's Node. The checks run in SiegeKit's own
    # process. gate.sh checks each scan against its known answer and its
    # measured result (.github/gate/logins/results.txt), and counts the
    # logins Supabase Auth got, so a login the app never ran is seen.
    name: Form logins on Next.js and Supabase Auth (auth on ${{ matrix.engine }}${{ matrix.os == 'ubuntu-24.04-arm' && ', arm64' || '' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [podman, docker]
        os: [ubuntu-latest, ubuntu-24.04-arm]
    env:
      APP_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Platform
        run: test "$(uname -m)" = "${{ matrix.os == 'ubuntu-24.04-arm' && 'aarch64' || 'x86_64' }}"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Build
        run: CGO_ENABLED=0 go build -o "$RUNNER_TEMP/siegekit" ./cmd/siegekit
      - name: App dependencies
        # Pinned in package-lock.json: Next.js, React and Supabase's SDKs.
        working-directory: .github/gate/logins
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Start Supabase Auth and the app
        run: SK="$RUNNER_TEMP/siegekit" W="$RUNNER_TEMP/logins" REPO="$GITHUB_WORKSPACE" .github/gate/logins/gate.sh start
      - name: Scan each login
        run: SK="$RUNNER_TEMP/siegekit" W="$RUNNER_TEMP/logins" REPO="$GITHUB_WORKSPACE" .github/gate/logins/gate.sh scan
      - name: Logs
        if: failure()
        run: SK="$RUNNER_TEMP/siegekit" W="$RUNNER_TEMP/logins" REPO="$GITHUB_WORKSPACE" .github/gate/logins/gate.sh logs
