name: Real-repo gate

# M1 gate: scanning real repositories must never crash, fail or time out.
# Each repository is pinned to a commit so results are reproducible.
# M2.4b (ADR 0023): a URL scan of OWASP Juice Shop, a known vulnerable app.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC
  # Also on changes that most affect how real repositories are scanned.
  pull_request:
    paths:
      - .github/workflows/gate.yml
      - plugins/**
      - internal/runner/**
      - internal/sandbox/**
      - internal/checks/**
      - internal/egress/**
      - internal/relay/**

# Read-only (ADR 0008).
permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.4"

jobs:
  scan:
    name: Scan ${{ matrix.repo }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - { repo: pallets/flask, sha: 49943b5a94413a530761350f04e896f76e8d620e }
          - { repo: psf/requests, sha: 3c7baaa05ab4aa49cc819ce3a819d260de19c157 }
          - { repo: encode/httpx, sha: 7cff5f79bc78649bbcd3fd9aa7a74c86e0f63016 }
          - { repo: gin-gonic/gin, sha: 0f09c3a9b4626d9fe9979cf4d0521d6ae32ab646 }
          - { repo: spf13/cobra, sha: adbc8813901bba65827259daa8e22ff94ec1f30e }
          - { repo: go-chi/chi, sha: c64ed7d6635f33a8b2feaff7dcfa55677023ac7d }
          - { repo: expressjs/express, sha: 43fca52d28a422c8be48fd489cbd4f2d6152bab6 }
          - { repo: OWASP/NodeGoat, sha: c5cb68a7084e4ae7dcc60e6a98768720a81841e8 }
          - { repo: juice-shop/juice-shop, sha: 266448aba68cd8ba5915f526a128da4fa7bc3f9f }
          - { repo: digininja/DVWA, sha: 502ac150ce37c20ca6e04cab7c5ca959f315f2d0 }
          - { repo: kubernetes/examples, sha: 22934a040acbb0c0aa103023ccbd871507bf17f6 }
          - { repo: terraform-aws-modules/terraform-aws-vpc, sha: 577ad620abe00da27a3a0f1e5acee041959fb3be }
          - { repo: docker/awesome-compose, sha: 30f4b7f6a6c3b0c0ecf4d4efb0de203c48d11562 }
          - { repo: firebase/quickstart-js, sha: 474e779bc3f0af1c620fb9dfa53e933e6aa3edd7 }
          - { repo: vercel/nextjs-subscription-payments, sha: bdd0813206e47e6b218d42f15a7976c8a0d3c3eb }
          - { repo: fastapi/full-stack-fastapi-template, sha: 77e550a73bb49dd2967622c5ed11bf7a49603c93 }
          - { repo: psf/black, sha: c0e143e75443afd3be50c3b63ed2ee2fd108f509 }
          - { repo: caddyserver/caddy, sha: 16618f454ca6f78f37dfd85a90573d8ffd43c1c8 }
          - { repo: pallets/click, sha: 08b803cf32ceb2ae6a772c62d5da42757a897d44 }
          - { repo: bridgecrewio/terragoat, sha: 729f8da62c6a85ce4af5ad3d123de97776d954c4 }
    steps:
      # Actions are pinned to full commit SHAs (ADR 0008). Tag shown for reference only.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Build
        run: go build -o "$RUNNER_TEMP/siegekit" ./cmd/siegekit
      - name: Fetch target at pinned commit
        env:
          REPO: ${{ matrix.repo }}
          SHA: ${{ matrix.sha }}
        run: |
          dir="$RUNNER_TEMP/target"
          git init -q "$dir"
          git -C "$dir" fetch -q --depth 1 "https://github.com/$REPO.git" "$SHA"
          git -C "$dir" -c advice.detachedHead=false checkout -q FETCH_HEAD
          test "$(git -C "$dir" rev-parse HEAD)" = "$SHA"
      - name: Scan
        # Exit 0 (clean) or 3 (findings); 4 means a check failed or timed
        # out, anything else is an error or a crash. Exit 3 wins over 4, so
        # the report is checked too.
        run: |
          set +e
          "$RUNNER_TEMP/siegekit" scan --yes --update --no-save --report-dir "$RUNNER_TEMP/report" "$RUNNER_TEMP/target"
          code=$?
          set -e
          echo "exit code $code"
          if [ "$code" -ne 0 ] && [ "$code" -ne 3 ]; then exit 1; fi
          # Belt and braces: every plugin ran, or was skipped because the
          # repository has no files of its language.
          jq -e '[.plugins[] | select(.status != "ran" and (.status != "skipped" or (.reason | startswith("no files matching") | not)))] | length == 0' "$RUNNER_TEMP/report/report.json"

  web:
    # M2.4b (ADR 0023): URL scan of OWASP Juice Shop v20.4.0, a deliberately
    # vulnerable app, running on this runner's loopback (local mode). The
    # image is pinned to the multi-architecture index digest of tag v20.4.0,
    # resolved with `docker buildx imagetools inspect` on 2026-11-19.
    name: Scan OWASP Juice Shop by URL
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Build
        # Static, because the relay runs this binary in Alpine (ADR 0021).
        run: CGO_ENABLED=0 go build -o "$RUNNER_TEMP/siegekit" ./cmd/siegekit
      - name: Start Juice Shop
        run: |
          docker run -d --name juice-shop -p 127.0.0.1:3000:3000 \
            docker.io/bkimminich/juice-shop@sha256:9bbaecc41791f00b002bc65931cc5ff355fbdb941fa72b06558c18dace43197b
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:3000/ && exit 0
            sleep 2
          done
          docker logs juice-shop
          exit 1
      - name: Scan
        # --authorized-host stands for the owner's confirmation of the attack
        # scan on this runner's own app (ADR 0005); --yes does not count.
        # Exit 0 or 3 as above. ffuf and both ZAP and Nuclei plugins must run and
        # reach the app, and the passive checks must report the issues seen
        # in every local run on 2026-11-19: no Content-Security-Policy (ZAP rule 10038) and
        # a permissive CORS header (10098). Juice Shop serves no OpenAPI spec
        # at the default paths (it answers them with HTML, measured
        # 2026-11-20), so schemathesis must be skipped for that reason (ADR 0028).
        # Juice Shop does not limit failed logins (20 logins for
        # jim@juice-sh.op all answered 401, measured 2026-11-20), so
        # login-throttle must send 20 logins and report login-not-limited
        # (ADR 0030).
        run: |
          set +e
          "$RUNNER_TEMP/siegekit" scan --yes --authorized-host 127.0.0.1 --no-save --report-dir "$RUNNER_TEMP/report" \
            --login-url http://127.0.0.1:3000/rest/user/login --login-user jim@juice-sh.op \
            --login-body '{"email":"{user}","password":"{password}"}' http://127.0.0.1:3000/
          code=$?
          set -e
          echo "exit code $code"
          if [ "$code" -ne 0 ] && [ "$code" -ne 3 ]; then exit 1; fi
          r="$RUNNER_TEMP/report/report.json"
          jq '.plugins[] | {id, status, reason, input, result, requests, refused, refusedTo, findings}' "$r"
          jq -e '[.plugins[] | select(.status == "ran" and .requests > 0) | .id] | sort == ["ffuf", "login-throttle", "nuclei", "nuclei-default-login", "nuclei-intrusive", "zap", "zap-active"]' "$r"
          jq -e '[.plugins[] | select(.id == "schemathesis" and .status == "skipped" and (.reason | contains("none was found at /openapi.json")))] | length == 1' "$r"
          jq -e '[.plugins[] | select(.id == "login-throttle" and .requests == 20)] | length == 1' "$r"
          jq -e '[.findings[] | select(.ruleId == "login-not-limited" and .location.uri == "http://127.0.0.1:3000/rest/user/login")] | length == 1' "$r"
          for rule in 10038 10098; do
            jq -e --arg rule "$rule" '[.findings[] | select(.ruleId == $rule)] | length > 0' "$r" > /dev/null || { echo "ZAP rule $rule not reported"; exit 1; }
          done
      - name: Juice Shop log
        if: failure()
        run: docker logs juice-shop 2>&1 | tail -50
