name: Measure Docker Hub sign-in (temporary)

# Temporary, removed before merge. SK-8 Q7 option C: Docker Hub pull limits
# anonymous vs signed in (the rate-limit headers Docker Hub returns), and
# whether SiegeKit's own pull (sandbox.Engine.Pull, minimal environment)
# uses the engine's stored sign-in. The token is never printed.
on:
  pull_request:
    paths:
      - .github/workflows/zz-measure-hub.yml

permissions:
  contents: read

jobs:
  hub:
    name: ${{ matrix.engine }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: [podman, docker]
    env:
      E: ${{ matrix.engine }}
      SIEGEKIT_ENGINE: ${{ matrix.engine }}
      ZZ_IMAGE: docker.io/library/alpine@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          cache: false
      - name: Limits, anonymous and signed in
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -u +e
          echo "secrets present: user=$([ -n "$DH_USER" ] && echo yes || echo no) token=$([ -n "$DH_TOKEN" ] && echo yes || echo no)"
          q='https://auth.docker.io/token?service=registry.docker.io&scope=repository:ratelimitpreview/test:pull'
          anon=$(curl -fsS "$q" | jq -r .token)
          echo "anonymous: $(curl -fsSI -H "Authorization: Bearer $anon" https://registry-1.docker.io/v2/ratelimitpreview/test/manifests/latest | grep -i '^ratelimit\|^docker-ratelimit-source' | tr -d '\r' | sed 's/docker-ratelimit-source: .*/docker-ratelimit-source: (redacted)/I' | tr '\n' ' ')"
          auth=$(curl -fsS -u "$DH_USER:$DH_TOKEN" "$q" | jq -r .token)
          echo "signed in: $(curl -fsSI -H "Authorization: Bearer $auth" https://registry-1.docker.io/v2/ratelimitpreview/test/manifests/latest | grep -i '^ratelimit\|^docker-ratelimit-source' | tr -d '\r' | sed 's/docker-ratelimit-source: .*/docker-ratelimit-source: (redacted)/I' | tr '\n' ' ')"
      - name: SiegeKit's pull uses the engine's sign-in
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -u +e
          cat > internal/sandbox/zz_pull_test.go <<'GO'
          package sandbox

          import (
          	"context"
          	"os"
          	"testing"
          )

          func TestZZPull(t *testing.T) {
          	e, err := Detect()
          	if err != nil {
          		t.Fatal(err)
          	}
          	t.Logf("engine %s podman=%v pull err=%v", e.Bin, e.Podman, e.Pull(context.Background(), os.Getenv("ZZ_IMAGE")))
          }
          GO
          go test -c -o $RUNNER_TEMP/pull.test ./internal/sandbox/ || exit 1
          pull() { $E rmi -f $ZZ_IMAGE > /dev/null 2>&1; echo "$1: $($RUNNER_TEMP/pull.test -test.run TestZZPull -test.v 2>&1 | grep -o 'pull err=.*' | cut -c1-200)"; }
          bad=$(printf 'nobody-siegekit:wrong' | base64)
          if [ "$E" = docker ]; then
            pull "not signed in"
            mkdir -p $RUNNER_TEMP/badcfg; echo "{\"auths\":{\"https://index.docker.io/v1/\":{\"auth\":\"$bad\"}}}" > $RUNNER_TEMP/badcfg/config.json
            DOCKER_CONFIG=$RUNNER_TEMP/badcfg pull "wrong sign-in in DOCKER_CONFIG"
            printf '%s' "$DH_TOKEN" | docker login -u "$DH_USER" --password-stdin > /dev/null 2>&1; echo "docker login exit=$?"
            pull "signed in (docker login)"
            docker logout > /dev/null
          else
            a=${XDG_RUNTIME_DIR:-/run/user/$(id -u)}/containers/auth.json; echo "podman auth file: $a"
            pull "not signed in"
            mkdir -p $(dirname $a); echo "{\"auths\":{\"docker.io\":{\"auth\":\"$bad\"}}}" > $a
            pull "wrong sign-in in auth.json"
            rm -f $a
            printf '%s' "$DH_TOKEN" | podman login docker.io -u "$DH_USER" --password-stdin > /dev/null 2>&1; echo "podman login exit=$?"
            pull "signed in (podman login)"
            podman logout docker.io > /dev/null
          fi
