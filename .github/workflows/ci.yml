name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only by default (ADR 0008). Jobs that need more must ask for it explicitly.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.4"
  GOVULNCHECK_VERSION: "v1.9.0"
  # staticcheck 2026.2.2 and deadcode from golang.org/x/tools v0.52.0,
  # pinned by module version (checked against sum.golang.org by go run).
  STATICCHECK_VERSION: "v0.8.2"
  DEADCODE_VERSION: "v0.52.0"

jobs:
  test:
    name: Test (${{ matrix.os }}${{ matrix.engine && format(', {0}', matrix.engine) || '' }})
    strategy:
      fail-fast: false
      matrix:
        # The container tests run on both engines (ADR 0039): the runners
        # have rootless Podman and rootful Docker, and a result holds only
        # for the engine it ran on (ADR 0038).
        # ubuntu-24.04-arm is GitHub's ARM Linux runner: the arm64 pulls of
        # the pinned images and the same tests and self-scan (ADR 0060,
        # owner 2026-11-22, in place of an Apple-chip Mac for now).
        include:
          - { os: ubuntu-latest, engine: podman, expect: podman rootless, arch: amd64 }
          - { os: ubuntu-latest, engine: docker, expect: docker rootful, arch: amd64 }
          - { os: ubuntu-24.04-arm, engine: podman, expect: podman rootless, arch: arm64 }
          - { os: ubuntu-24.04-arm, engine: docker, expect: docker rootful, arch: arm64 }
          - { os: macos-latest }
    runs-on: ${{ matrix.os }}
    # Above the worst case of the steps' own limits (go test -timeout 30m,
    # 17.5 minutes of fuzzing, the self-scan), so a hung test is ended by
    # Go with its goroutine dump, not by GitHub without one (full project
    # check F13).
    timeout-minutes: 60
    env:
      # Every step that runs containers uses this engine (ADR 0039).
      SIEGEKIT_ENGINE: ${{ matrix.engine }}
    steps:
      # Actions are pinned to full commit SHAs (ADR 0008). Tag shown for reference only.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Test
        env:
          # Container sandbox tests need a container engine, which GitHub
          # provides on Linux runners only. SIEGEKIT_ENGINE picks it; the
          # runners' Podman is rootless and their Docker rootful (measured
          # 2026-11-20, ADR 0038). TestDescribe fails if that changes.
          SIEGEKIT_CONTAINER_TESTS: ${{ runner.os == 'Linux' && '1' || '0' }}
          SIEGEKIT_EXPECT_ENGINE: ${{ matrix.expect }}
        # The container tests run full scans (ZAP, Nuclei): more than the default 10 minutes.
        run: go test -race -count=1 -cover -timeout 30m ./...
      - name: Scan SiegeKit itself
        if: runner.os == 'Linux'
        env:
          EXPECT_ARCH: ${{ matrix.arch }}
        # Any finding fails CI (owner decision, 2026-11-19): --fail-on info
        # makes every finding exit 3. Fake keys in test data carry
        # gitleaks:allow, which reports count. Exit 3 wins over 4
        # (incomplete), so the report is checked too: every check ran or had
        # no files of its language.
        run: |
          go build -o "$RUNNER_TEMP/siegekit" ./cmd/siegekit
          set +e
          "$RUNNER_TEMP/siegekit" scan --yes --update --fail-on info --no-save --report-dir "$RUNNER_TEMP/self-report" .
          code=$?
          set -e
          echo "exit code $code"
          jq '.findings[] | {ruleId, severity, uri: .location.uri, line: .location.startLine}' "$RUNNER_TEMP/self-report/report.json"
          if [ "$code" -ne 0 ]; then exit 1; fi
          jq -e --arg e "$SIEGEKIT_ENGINE" '.environment.engine.name == $e' "$RUNNER_TEMP/self-report/report.json"
          jq -e --arg g "go$GO_VERSION" '.environment.go == $g' "$RUNNER_TEMP/self-report/report.json"
          jq -e --arg a "$EXPECT_ARCH" '.environment.os == "linux" and .environment.arch == $a' "$RUNNER_TEMP/self-report/report.json"
          jq -e '[.plugins[] | select(.status != "ran" and (.status != "skipped" or .cause != "no-files"))] | length == 0' "$RUNNER_TEMP/self-report/report.json"
      - name: Fuzz parsers
        # Once: the parsers are plain Go, with no code per architecture.
        if: matrix.engine == 'podman' && matrix.arch == 'amd64'
        run: |
          go test -run='^$' -fuzz='^FuzzParse$' -fuzztime=60s ./internal/manifest
          go test -run='^$' -fuzz='^FuzzSARIF$' -fuzztime=60s ./internal/sarif
          go test -run='^$' -fuzz='^FuzzBandit$' -fuzztime=30s ./internal/bandit
          go test -run='^$' -fuzz='^FuzzTrivy$' -fuzztime=30s ./internal/trivy
          go test -run='^$' -fuzz='^FuzzGosecErrors$' -fuzztime=30s ./internal/gosec
          go test -run='^$' -fuzz='^FuzzNuclei$' -fuzztime=30s ./internal/nuclei
          go test -run='^$' -fuzz='^FuzzFFUF$' -fuzztime=30s ./internal/ffuf
          go test -run='^$' -fuzz='^FuzzSchemathesis$' -fuzztime=30s ./internal/schemathesis
          go test -run='^$' -fuzz='^FuzzCheck$' -fuzztime=30s ./internal/openapi
          go test -run='^$' -fuzz='^FuzzBasePath$' -fuzztime=30s ./internal/openapi
          go test -run='^$' -fuzz='^FuzzLogin$' -fuzztime=30s ./internal/login
          go test -run='^$' -fuzz='^FuzzLinks$' -fuzztime=30s ./internal/served
          go test -run='^$' -fuzz='^FuzzBackendRules$' -fuzztime=30s ./internal/checks
          go test -run='^$' -fuzz='^FuzzDotenv$' -fuzztime=30s ./internal/checks
          go test -run='^$' -fuzz='^FuzzWeakHits$' -fuzztime=30s ./internal/checks
          go test -run='^$' -fuzz='^FuzzParseIndex$' -fuzztime=30s ./internal/checks
          go test -run='^$' -fuzz='^FuzzParse$' -fuzztime=60s ./internal/target
          go test -run='^$' -fuzz='^FuzzOnOrigin$' -fuzztime=30s ./internal/target
          go test -run='^$' -fuzz='^FuzzParseHAR$' -fuzztime=30s ./internal/authz
          go test -run='^$' -fuzz='^FuzzParseWrites$' -fuzztime=30s ./internal/authz
          go test -run='^$' -fuzz='^FuzzSweepRoutes$' -fuzztime=30s ./internal/authz
          go test -run='^$' -fuzz='^FuzzTokenizeJS$' -fuzztime=30s ./internal/coderoutes
          go test -run='^$' -fuzz='^FuzzGoRoutes$' -fuzztime=30s ./internal/coderoutes
          go test -run='^$' -fuzz='^FuzzParse$' -fuzztime=30s ./internal/ratelimit
          go test -run='^$' -fuzz='^FuzzPagesFromHAR$' -fuzztime=30s ./internal/ratelimit
          go test -run='^$' -fuzz='^FuzzAddresses$' -fuzztime=30s ./internal/mailcatcher
          go test -run='^$' -fuzz='^FuzzParse$' -fuzztime=30s ./internal/backend
          go test -run='^$' -fuzz='^FuzzReadScripts$' -fuzztime=30s ./internal/backend
          go test -run='^$' -fuzz='^FuzzParseStorage$' -fuzztime=30s ./internal/backend
          go test -run='^$' -fuzz='^FuzzReadStorageScripts$' -fuzztime=30s ./internal/backend
          go test -run='^$' -fuzz='^FuzzStorageRuleFolders$' -fuzztime=30s ./internal/checks
          go test -run='^$' -fuzz='^FuzzStatus$' -fuzztime=30s ./internal/waiter
      - name: Staticcheck
        # On both architectures: each checks the code built for its GOARCH.
        if: matrix.engine == 'podman'
        run: go run honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION} ./...
      - name: Dead code
        if: matrix.engine == 'podman'
        # deadcode lists functions no main package reaches; any is a failure.
        run: |
          out="$(go run golang.org/x/tools/cmd/deadcode@${DEADCODE_VERSION} ./...)"
          if [ -n "$out" ]; then echo "$out"; exit 1; fi
      - name: Vulnerability check
        if: matrix.engine == 'podman'
        run: go run golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION} ./...
