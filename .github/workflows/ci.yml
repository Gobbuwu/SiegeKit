name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only by default (ADR 0008). Jobs that need more must ask for it explicitly.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.4"
  GOVULNCHECK_VERSION: "v1.9.0"

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      # Actions are pinned to full commit SHAs (ADR 0008). Tag shown for reference only.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Test
        env:
          # Container sandbox tests need Docker, which GitHub provides on Linux runners only.
          SIEGEKIT_CONTAINER_TESTS: ${{ runner.os == 'Linux' && '1' || '0' }}
        # The container tests run full scans (ZAP, Nuclei): more than the default 10 minutes.
        run: go test -race -count=1 -cover -timeout 30m ./...
      - name: Scan SiegeKit itself
        if: runner.os == 'Linux'
        # Any finding fails CI (owner decision, 2026-11-19): --fail-on info
        # makes every finding exit 3. Fake keys in test data carry
        # gitleaks:allow, which reports count. Exit 3 wins over 4
        # (incomplete), so the report is checked too: every check ran or had
        # no files of its language.
        run: |
          go build -o "$RUNNER_TEMP/siegekit" ./cmd/siegekit
          set +e
          "$RUNNER_TEMP/siegekit" scan --yes --update --fail-on info --no-save --report-dir "$RUNNER_TEMP/self-report" .
          code=$?
          set -e
          echo "exit code $code"
          jq '.findings[] | {ruleId, severity, uri: .location.uri, line: .location.startLine}' "$RUNNER_TEMP/self-report/report.json"
          if [ "$code" -ne 0 ]; then exit 1; fi
          jq -e '[.plugins[] | select(.status != "ran" and (.status != "skipped" or (.reason | startswith("no files matching") | not)))] | length == 0' "$RUNNER_TEMP/self-report/report.json"
      - name: Fuzz parsers
        if: runner.os == 'Linux'
        run: |
          go test -run='^$' -fuzz=FuzzParse -fuzztime=60s ./internal/manifest
          go test -run='^$' -fuzz=FuzzSARIF -fuzztime=60s ./internal/sarif
          go test -run='^$' -fuzz=FuzzBandit -fuzztime=30s ./internal/bandit
          go test -run='^$' -fuzz=FuzzNuclei -fuzztime=30s ./internal/nuclei
          go test -run='^$' -fuzz=FuzzFFUF -fuzztime=30s ./internal/ffuf
          go test -run='^$' -fuzz=FuzzBackendRules -fuzztime=30s ./internal/checks
          go test -run='^$' -fuzz=FuzzDotenv -fuzztime=30s ./internal/checks
          go test -run='^$' -fuzz=FuzzParse -fuzztime=60s ./internal/target
      - name: Vulnerability check
        if: runner.os == 'Linux'
        run: go run golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION} ./...
