name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only by default (ADR 0008). Jobs that need more must ask for it explicitly.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.4"
  GOVULNCHECK_VERSION: "v1.9.0"

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      # Actions are pinned to full commit SHAs (ADR 0008). Tag shown for reference only.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Test
        env:
          # Container sandbox tests need Docker, which GitHub provides on Linux runners only.
          SIEGEKIT_CONTAINER_TESTS: ${{ runner.os == 'Linux' && '1' || '0' }}
        run: go test -race -count=1 -cover ./...
      - name: Fuzz parsers
        if: runner.os == 'Linux'
        run: |
          go test -run='^$' -fuzz=FuzzParse -fuzztime=60s ./internal/manifest
          go test -run='^$' -fuzz=FuzzSARIF -fuzztime=60s ./internal/sarif
          go test -run='^$' -fuzz=FuzzBandit -fuzztime=30s ./internal/bandit
          go test -run='^$' -fuzz=FuzzBackendRules -fuzztime=30s ./internal/checks
      - name: Vulnerability check
        if: runner.os == 'Linux'
        run: go run golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION} ./...

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Every commit has Signed-off-by
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$c" | grep -q '^Signed-off-by: '; then
              echo "Missing Signed-off-by: $(git log -1 --format='%h %s' "$c")"
              missing=1
            fi
          done
          exit $missing
