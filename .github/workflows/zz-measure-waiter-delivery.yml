name: Measure waiter delivery (temporary)

# TEMPORARY, removed before merge (ADR 0067 build PR 1, owner rule
# 2026-11-24: every option on a decision card measured through SiegeKit).
# How the waiter gets into each tool container:
#   A  embedded prebuilt waiter (this branch's code), plain `go build`
#   B  SiegeKit's own binary as the waiter (SIEGEKIT_MEASURE_WAITER=own-binary),
#      with the plain build (Bdyn) and a CGO_ENABLED=0 build (Bstatic)
#   C  waiter built only for releases: a source build has none
#      (SIEGEKIT_MEASURE_WAITER=none), and the build with the files removed
#   D  (outside SiegeKit) a derived image per tool with the waiter baked in
on:
  # Dispatch too: the push of round 2 (2b2abdf) started no workflow at all.
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/zz-measure-waiter-delivery.yml

permissions:
  contents: read

env:
  GO_VERSION: "1.27.4"

jobs:
  linux:
    name: Linux (${{ matrix.engine }}, ${{ matrix.os }})
    # Round 1 only (run 45508679731); round 2 is macOS.
    if: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        engine: [podman, docker]
        os: [ubuntu-latest, ubuntu-24.04-arm]
    env:
      SIEGEKIT_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Build the variants
        run: |
          set -u
          T=$RUNNER_TEMP
          go build -o $T/sk-plain ./cmd/siegekit
          CGO_ENABLED=0 go build -o $T/sk-static ./cmd/siegekit
          file $T/sk-plain $T/sk-static | sed 's/, Go BuildID.*//'
          echo "== C: plain go build with the waiter files absent"
          mkdir $T/bin-save && mv internal/waiterbin/bin/* $T/bin-save/
          set +e; go build -o $T/sk-c ./cmd/siegekit 2>&1 | tail -3; echo "C build exit=${PIPESTATUS[0]}"; set -e
          mv $T/bin-save/* internal/waiterbin/bin/
      - name: Scan real repositories with each variant
        run: |
          set -u +e
          T=$RUNNER_TEMP
          for REPO in juice-shop/juice-shop spf13/cobra; do
            answers="testdata/known-answers/${REPO//\//__}.json"
            SHA="$(jq -r '.fixture | split("@")[1]' "$answers")"
            dir="$T/target-${REPO//\//__}"
            git init -q "$dir"; git -C "$dir" fetch -q --depth 1 "https://github.com/$REPO.git" "$SHA"; git -C "$dir" -c advice.detachedHead=false checkout -q FETCH_HEAD
            for v in A:sk-plain: Bdyn:sk-plain:own-binary Bstatic:sk-static:own-binary C:sk-plain:none; do
              IFS=: read n b e <<<"$v"
              r="$T/report-$n-${REPO//\//__}"
              t0=$(date +%s)
              SIEGEKIT_MEASURE_WAITER=$e $T/$b scan --yes --update --no-save --report-dir "$r" "$dir" > "$r.log" 2>&1
              code=$?
              echo "RESULT $REPO $n exit=$code s=$(( $(date +%s)-t0 ))"
              jq -r '.plugins[] | "  \(.id) \(.status) \(.stop // "") usage=\(if .usage then "\(.usage.memoryPeak)/\(.usage.processPeak)" else "none" end) \(.reason // "" | .[0:160])"' "$r/report.json"
              go run ./internal/knownanswers/check -answers "$answers" -report "$r/report.json" -observed "$r.observed.json" > "$r.ka" 2>&1
              echo "  known answers exit=$? $(tail -1 "$r.ka" | cut -c1-200)"
            done
          done
      - name: D, outside SiegeKit, a derived image per tool
        run: |
          set -u +e
          T=$RUNNER_TEMP
          arch=$(go env GOARCH)
          mkdir -p $T/d && cp internal/waiterbin/bin/waiter-linux-$arch $T/d/wait
          imgs=$(grep -rhoE "(docker\.io|ghcr\.io)/[^\"' ]+@sha256:[0-9a-f]{64}" plugins/ | sort -u)
          tot=0
          for img in $imgs; do
            $SIEGEKIT_ENGINE image inspect "$img" > /dev/null 2>&1 || $SIEGEKIT_ENGINE pull -q "$img" > /dev/null 2>&1
            printf 'FROM %s\nCOPY --chmod=0755 wait /siegekit/waiter/wait\n' "$img" > $T/d/Containerfile
            t0=$(date +%s%N)
            $SIEGEKIT_ENGINE build -q -t "siegekit-derived-$(echo $img | md5sum | cut -c1-8)" -f $T/d/Containerfile $T/d > $T/d/out 2>&1
            c=$?; ms=$(( ($(date +%s%N)-t0)/1000000 )); tot=$((tot+ms))
            echo "D $img build exit=$c ms=$ms $(tail -1 $T/d/out | cut -c1-80)"
          done
          echo "D total build ms=$tot"
          $SIEGEKIT_ENGINE images --format '{{.Repository}} {{.Size}}' | grep siegekit-derived | head -20

  mac:
    name: macOS Intel with Colima
    runs-on: macos-15-intel
    timeout-minutes: 150
    env:
      SIEGEKIT_ENGINE: docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Install and start Colima
        run: |
          set -u +e
          sw_vers; uname -m
          brew install colima docker > /dev/null 2>&1; echo "brew exit=$?"
          t0=$(date +%s); colima start --cpu 3 --memory 8 --disk 60 2>&1 | tail -3; echo "start s=$(( $(date +%s)-t0 ))"
          docker info --format 'server={{.ServerVersion}} cgroup={{.CgroupVersion}} arch={{.Architecture}}'
      - name: Build this branch and main
        run: |
          set -u
          T=$RUNNER_TEMP
          go build -o $T/sk-plain ./cmd/siegekit
          git fetch -q --depth 1 origin main && git worktree add -q $T/main FETCH_HEAD
          (cd $T/main && git log -1 --format='main at %h %s' && go build -o $T/sk-main ./cmd/siegekit)
          file $T/sk-plain $T/sk-main
          echo "TMPDIR=$TMPDIR"; colima list; colima ssh -- sh -c "mount | grep -E 'virtiofs|9p|sshfs' | cut -c1-160"
      - name: Scan a real repository with each variant (round 2)
        run: |
          set -u +e
          T=$RUNNER_TEMP
          REPO=pallets/flask
          answers="testdata/known-answers/${REPO//\//__}.json"
          SHA="$(jq -r '.fixture | split("@")[1]' "$answers")"
          dir="$T/target"
          git init -q "$dir"; git -C "$dir" fetch -q --depth 1 "https://github.com/$REPO.git" "$SHA"; git -C "$dir" -c advice.detachedHead=false checkout -q FETCH_HEAD
          mkdir -p "$HOME/sk-tmp"; chmod 700 "$HOME/sk-tmp"
          for v in main:sk-main::default A:sk-plain::default main:sk-main::home A:sk-plain::home B:sk-plain:own-binary:home C:sk-plain:none:home; do
            IFS=: read n b e tmp <<<"$v"
            r="$T/report-$n-$tmp"
            if [ "$tmp" = home ]; then td="$HOME/sk-tmp"; else td="$TMPDIR"; fi
            t0=$(date +%s)
            TMPDIR="$td" SIEGEKIT_MEASURE_WAITER=$e $T/$b scan --yes --update --no-save --report-dir "$r" "$dir" > "$r.log" 2>&1
            code=$?
            echo "RESULT $REPO $n tmp=$tmp exit=$code s=$(( $(date +%s)-t0 ))"
            jq -r '.plugins[] | "  \(.id) \(.status) \(.stop // "") usage=\(if .usage then "\(.usage.memoryPeak)/\(.usage.processPeak)" else "none" end) \(.reason // "" | .[0:200])"' "$r/report.json"
            grep -m3 -E "docker: |Error|exec format" "$r.log" | cut -c1-300
            go run ./internal/knownanswers/check -answers "$answers" -report "$r/report.json" -observed "$r.observed.json" > "$r.ka" 2>&1
            echo "  known answers exit=$? $(tail -1 "$r.ka" | cut -c1-200)"
          done
