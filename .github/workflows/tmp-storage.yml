# TEMPORARY (removed before merge): ADR 0058's real runs on a cgroup v2 runner.
name: Storage write cgroup v2 (temporary)
on:
  pull_request:
permissions:
  contents: read
jobs:
  storage:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          cache: false
      - name: Real runs, Firebase emulator and Supabase Storage, Docker and rootless Podman
        run: .github/tmp-storage/ci.sh
