name: Measure on macOS with Colima (temporary)

# Temporary, removed before merge. Round 2 on GitHub's Intel macOS runner with
# Colima (Docker): Q6 (CA file, Keychain, proxy on the Mac's loopback) first,
# then why round 1's scans were ~30x slower than Linux, and Q2B with a volume.
# Round 1 (run 45298152251) covered Q7 and go-chi Q1A/Q2B; caddy timed out.
on:
  pull_request:
    paths:
      - .github/workflows/zz-measure-mac.yml

permissions:
  contents: read

jobs:
  mac:
    runs-on: macos-15-intel
    timeout-minutes: 150
    env:
      IMG: ghcr.io/securego/gosec@sha256:7bcf1edbab3e80d8006a28d53e7031a9c9775be8eec30679e4adc1f51d272121
      TRIVY: docker.io/aquasec/trivy@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
      ALPINE: docker.io/library/alpine@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          cache: false
      - name: Install and start Colima
        run: |
          set -u +e
          sw_vers; uname -m; sysctl -n machdep.cpu.brand_string hw.memsize kern.hv_support 2>&1 | tr '\n' ' '; echo
          t0=$(date +%s); brew install colima docker > /dev/null 2>&1; echo "brew exit=$? s=$(( $(date +%s)-t0 ))"
          colima version
          t0=$(date +%s); colima start --cpu 3 --memory 8 --disk 60 2>&1 | tail -3 || true
          colima status 2>&1 | tail -5; echo "start s=$(( $(date +%s)-t0 ))"
          if ! docker info > /dev/null 2>&1; then colima delete -f; colima start --vm-type qemu --cpu 3 --memory 8 --disk 60 2>&1 | tail -3; colima status 2>&1 | tail -5; fi
          docker info --format 'server={{.ServerVersion}} cgroup={{.CgroupVersion}} os={{.OperatingSystem}} arch={{.Architecture}} cpus={{.NCPU}}'
          colima list
      - name: Q6 CA file, Keychain, and a proxy on the Mac's loopback
        run: |
          set -u +e
          T=$RUNNER_TEMP
          docker pull -q $IMG > /dev/null; docker pull -q $ALPINE > /dev/null
          openssl req -x509 -newkey rsa:2048 -nodes -keyout $T/k.pem -out $T/ca.pem -days 1 -subj /CN=siegekit-throwaway-ca 2>/dev/null; chmod 644 $T/ca.pem
          base="--rm --pull never --user $(id -u):$(id -g) --cap-drop ALL --security-opt no-new-privileges --read-only --tmpfs /tmp:rw,nosuid,nodev,noexec,size=1024m --memory 2048m --memory-swap 2048m --cpus 2 --pids-limit 256 --env HOME=/tmp"
          CA="--mount type=bind,source=$T/ca.pem,target=/etc/siegekit-ca.pem,readonly --env SSL_CERT_FILE=/etc/siegekit-ca.pem"
          gm() { docker run $base --env GOPATH=/tmp/go --env GOTOOLCHAIN=local --env GOPROXY=https://proxy.golang.org --env 'GOVCS=*:off' "$@" --workdir /tmp --entrypoint go $IMG mod download -json github.com/google/uuid@v1.6.0 > $T/g.json 2>&1; echo "exit=$? $(grep -o '"Error": "[^"]*' $T/g.json | cut -c1-170)"; }
          echo "go mod download, extra CA mounted from the Mac: $(gm $CA)"
          mkdir -p $T/db; chmod 777 $T/db; t0=$(date +%s)
          docker run $base $CA --mount type=bind,source=$T/db,target=/tmp/trivy/db $TRIVY image --cache-dir /tmp/trivy --download-db-only --no-progress > $T/t.log 2>&1
          echo "trivy update, extra CA, DB on a Mac folder: exit=$? s=$(( $(date +%s)-t0 )) db_mb=$(du -sm $T/db | cut -f1) $(grep -E 'x509|FATAL' $T/t.log | cut -c1-160 | tail -1)"
          echo "--- Keychain"
          sudo security add-trusted-cert -d -r trustRoot -k /Library/Keychains/System.keychain $T/ca.pem; echo "add-trusted-cert exit=$?"
          echo "in System.keychain export: $(security find-certificate -a -c siegekit-throwaway-ca -p /Library/Keychains/System.keychain | grep -c BEGIN)"
          for f in /etc/ssl/cert.pem /usr/local/etc/openssl@3/cert.pem /usr/local/etc/ca-certificates/cert.pem; do [ -f $f ] && echo "in $f: $(openssl crl2pkcs7 -nocrl -certfile $f 2>/dev/null | openssl pkcs7 -print_certs -noout 2>/dev/null | grep -c siegekit-throwaway-ca)"; done
          echo "--- proxy on the Mac's 127.0.0.1"
          mkdir -p $T/cpsrc && printf 'module cp\n\ngo 1.24\n' > $T/cpsrc/go.mod
          cat > $T/cpsrc/main.go <<'GO'
          // Minimal HTTP CONNECT proxy for a measurement: forwards CONNECT host:443 and logs each target.
          package main

          import (
          	"io"
          	"log"
          	"net"
          	"net/http"
          	"os"
          	"time"
          )

          func main() {
          	log.Fatal(http.ListenAndServe(os.Args[1], http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {
          		if r.Method != http.MethodConnect {
          			http.Error(w, "CONNECT only", http.StatusMethodNotAllowed)
          			return
          		}
          		log.Printf("CONNECT %s", r.Host)
          		up, err := net.DialTimeout("tcp", r.Host, 10*time.Second)
          		if err != nil {
          			http.Error(w, err.Error(), http.StatusBadGateway)
          			return
          		}
          		hj, _ := w.(http.Hijacker)
          		c, _, _ := hj.Hijack()
          		c.Write([]byte("HTTP/1.1 200 OK\r\n\r\n"))
          		go func() { io.Copy(up, c); up.Close() }()
          		io.Copy(c, up)
          		c.Close()
          	})))
          }
          GO
          (cd $T/cpsrc && go build -o $T/cp .) && ($T/cp 127.0.0.1:3128 > $T/cp.log 2>&1 &) ; sleep 2
          curl -sS -o /dev/null -w "host curl via proxy: %{http_code}\n" -x http://127.0.0.1:3128 https://proxy.golang.org/
          for h in 127.0.0.1 host.lima.internal host.docker.internal 192.168.5.2; do echo "container HTTPS_PROXY=http://$h:3128: $(gm --env HTTPS_PROXY=http://$h:3128)"; done
          echo "proxy log: $(awk '{print $NF}' $T/cp.log | sort | uniq -c | tr '\n' ' ')"
      - name: Why it is slow, and Q2B with a volume (go-chi)
        run: |
          set -u +e
          T=$RUNNER_TEMP; R=$T/chi
          docker pull -q "$IMG" > /dev/null
          git init -q $R && git -C $R fetch -q --depth 1 https://github.com/go-chi/chi.git c64ed7d6635f33a8b2feaff7dcfa55677023ac7d && git -C $R -c advice.detachedHead=false checkout -q FETCH_HEAD
          # Same work (go list -export of go-chi, offline, empty build cache) in four places.
          t0=$(date +%s); (cd $R && GOCACHE=$(mktemp -d) GOFLAGS=-mod=mod GOPROXY=off go list -e -export ./... > /dev/null 2>&1); echo "TIME host (macOS, Go 1.27.4): $(( $(date +%s)-t0 )) s"
          common="--rm --pull never --user $(id -u):$(id -g) --network none --read-only --tmpfs /tmp:rw,size=1024m --cpus 2 --memory 2048m --env HOME=/tmp --env GOPATH=/tmp/go --env GOPROXY=off --env GOTOOLCHAIN=local --mount type=bind,source=$R,target=/target,readonly --workdir /target --entrypoint go"
          t0=$(date +%s); docker run $common $IMG list -e -export ./... > /dev/null 2>&1; echo "TIME container, cache in VM memory (tmpfs): $(( $(date +%s)-t0 )) s"
          mkdir -p $T/gc/tmp; chmod -R 777 $T/gc
          t0=$(date +%s); docker run $common --mount type=bind,source=$T/gc,target=/data/gocache --env GOCACHE=/data/gocache --env GOTMPDIR=/data/gocache/tmp $IMG list -e -export ./... > /dev/null 2>&1; echo "TIME container, cache in a Mac folder (virtiofs): $(( $(date +%s)-t0 )) s"
          docker volume create zzgc > /dev/null
          t0=$(date +%s); docker run $common --mount type=volume,source=zzgc,target=/data/gocache --env GOCACHE=/data/gocache --env GOTMPDIR=/data/gocache $IMG list -e -export ./... > /dev/null 2>&1; echo "TIME container, cache in a volume (VM disk): $(( $(date +%s)-t0 )) s exit=$?"
          docker volume rm zzgc > /dev/null
          cp -R $R $T/chi-copy; docker volume create zzsrc > /dev/null; docker run --rm -v zzsrc:/s -v $T/chi-copy:/c:ro --entrypoint sh $ALPINE -c 'cp -R /c/. /s/ && chown -R 501:20 /s' 
          t0=$(date +%s); docker run --rm --pull never --user $(id -u):$(id -g) --network none --read-only --tmpfs /tmp:rw,size=1024m --cpus 2 --memory 2048m --env HOME=/tmp --env GOPATH=/tmp/go --env GOPROXY=off --env GOTOOLCHAIN=local --mount type=volume,source=zzsrc,target=/target,readonly --workdir /target --entrypoint go $IMG list -e -export ./... > /dev/null 2>&1; echo "TIME container, source and cache in the VM (no virtiofs): $(( $(date +%s)-t0 )) s"
          docker volume rm zzsrc > /dev/null
          t0=$(date +%s); docker run --rm $ALPINE sh -c 'i=0; while [ $i -lt 3000000 ]; do i=$((i+1)); done'; echo "TIME CPU loop in a container: $(( $(date +%s)-t0 )) s"
          t0=$(date +%s); sh -c 'i=0; while [ $i -lt 3000000 ]; do i=$((i+1)); done'; echo "TIME CPU loop on the Mac: $(( $(date +%s)-t0 )) s"
          echo "VM: $(colima ssh -- sh -c 'nproc; grep -m1 "model name" /proc/cpuinfo; grep -c -w -E "vmx|svm" /proc/cpuinfo' | tr '\n' ' ')"
          # Q2B with a per-scan volume instead of a Mac folder: gosec scan of go-chi with its modules.
          S=$T/chi-stage; mkdir -p $S $T/gomod; chmod 777 $T/gomod
          (cd $R && find . \( -name .git -o -name vendor \) -prune -o \( -name go.mod -o -name go.sum \) -type f -print) | while read f; do mkdir -p "$S/$(dirname "$f")"; cp "$R/$f" "$S/$f"; done
          base="--rm --pull never --user $(id -u):$(id -g) --cap-drop ALL --security-opt no-new-privileges --read-only --tmpfs /tmp:rw,nosuid,nodev,noexec,size=256m --pids-limit 256 --cpus 2 --memory 2048m --memory-swap 2048m --env HOME=/tmp --workdir /tmp --env GOPATH=/tmp/go"
          for m in $(cd $S && find . -name go.mod -exec dirname {} \; | sort); do docker run $base --env GOMODCACHE=/data/gomod --env GOTOOLCHAIN=local --env GOPROXY=https://proxy.golang.org --env GOFLAGS=-mod=mod --env 'GOVCS=*:off' --mount type=bind,source=$S,target=/data/stage,readonly --mount type=bind,source=$T/gomod,target=/data/gomod --workdir /data/stage/$m --entrypoint go "$IMG" mod download > /dev/null 2>&1; echo "DOWNLOAD $m exit=$?"; done
          mkdir -p $T/out; chmod 777 $T/out
          docker volume create zzscr > /dev/null; docker run --rm -v zzscr:/s --entrypoint sh $ALPINE -c 'mkdir -p /s/tmp && chown -R 501:20 /s'
          t0=$(date +%s); docker run $base --network none --mount type=bind,source=$T/gomod,target=/data/gomod,readonly --env GOMODCACHE=/data/gomod --env GOPROXY=off --mount type=volume,source=zzscr,target=/data/gocache --env GOCACHE=/data/gocache --env GOTMPDIR=/data/gocache/tmp --mount type=bind,source=$R,target=/target,readonly --mount type=bind,source=$T/out,target=/out "$IMG" -concurrency 1 -fmt json -out /out/vol.json -no-fail /target/... > /dev/null 2> $T/vol.err
          echo "SCAN Avolume exit=$? s=$(( $(date +%s)-t0 )) SSA_SKIPS $(grep -c 'Error building the SSA' $T/vol.err) found=$(python3 -c "import json;d=json.load(open('$T/out/vol.json'));print(len({(i['rule_id'],i['file'],i['line']) for i in d['Issues'] or []}), 'pkgerrs', len(d.get('Golang errors') or {}))")"
          docker volume rm zzscr > /dev/null
