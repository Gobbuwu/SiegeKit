name: Measure on macOS with Colima (temporary)

# Temporary, removed before merge. The Go module download design (Q1A, Q2B)
# and SK-8 (Q6 CA and proxy, Q7 mirror and sign-in) on GitHub's Intel macOS
# runner with Colima (Docker), the setup the M2 record plans for macOS.
on:
  pull_request:
    paths:
      - .github/workflows/zz-measure-mac.yml

permissions:
  contents: read

jobs:
  mac:
    runs-on: macos-15-intel
    timeout-minutes: 150
    env:
      IMG: ghcr.io/securego/gosec@sha256:7bcf1edbab3e80d8006a28d53e7031a9c9775be8eec30679e4adc1f51d272121
      TRIVY: docker.io/aquasec/trivy@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
      ALPINE: docker.io/library/alpine@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          cache: false
      - name: Install and start Colima
        run: |
          set -u +e
          sw_vers; uname -m; sysctl -n machdep.cpu.brand_string hw.memsize kern.hv_support 2>&1 | tr '\n' ' '; echo
          t0=$(date +%s); brew install colima docker > /dev/null 2>&1; echo "brew exit=$? s=$(( $(date +%s)-t0 ))"
          colima version
          t0=$(date +%s); colima start --cpu 3 --memory 8 --disk 60 2>&1 | tail -3 || true
          colima status 2>&1 | tail -5; echo "start s=$(( $(date +%s)-t0 ))"
          if ! docker info > /dev/null 2>&1; then colima delete -f; colima start --vm-type qemu --cpu 3 --memory 8 --disk 60 2>&1 | tail -3; colima status 2>&1 | tail -5; fi
          docker info --format 'server={{.ServerVersion}} cgroup={{.CgroupVersion}} os={{.OperatingSystem}} arch={{.Architecture}} cpus={{.NCPU}}'
          colima list
      - name: Q7 mirror and sign-in under Colima
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -u +e
          f=~/.colima/default/colima.yaml; grep -n '^docker:' $f
          colima stop > /dev/null 2>&1
          perl -0pi -e 's/^docker: \{\}/docker:\n  registry-mirrors: ["https:\/\/mirror.gcr.io"]\n  debug: true/m' $f; grep -n -A2 '^docker:' $f
          colima start > /dev/null 2>&1; echo "restart exit=$?"
          docker info --format 'mirrors={{.RegistryConfig.Mirrors}}'
          docker rmi -f $TRIVY > /dev/null 2>&1
          docker pull -q $TRIVY; echo "mirror pull exit=$?"
          colima ssh -- sh -c 'sudo journalctl -u docker --no-pager 2>/dev/null || sudo cat /var/log/docker.log 2>/dev/null' | grep -o 'https://[a-z0-9.-]*/v2/[a-z]*/[a-z]*/[a-z]*' | sort | uniq -c | head
          docker run --rm --pull never $TRIVY --version | head -1
          docker rmi -f $ALPINE > /dev/null 2>&1
          printf '%s' "$DH_TOKEN" | docker login -u "$DH_USER" --password-stdin > /dev/null 2>&1; echo "docker login exit=$?"
          grep -o '"credsStore": *"[^"]*"' ~/.docker/config.json || echo "no credsStore"
          docker pull -q $ALPINE; echo "signed-in pull exit=$?"
          docker logout > /dev/null
      - name: Q1A + Q2B Go module download and scan
        run: |
          set -u +e
          T=$RUNNER_TEMP; echo "RUNNER_TEMP=$T"
          docker pull -q "$IMG" > /dev/null; echo "IMAGE: $(docker run --rm --entrypoint go "$IMG" version)"
          common="--rm --pull never --user $(id -u):$(id -g) --cap-drop ALL --security-opt no-new-privileges --read-only --tmpfs /tmp:rw,nosuid,nodev,noexec,size=256m --tmpfs /dev/shm:rw,nosuid,nodev,noexec,size=64m --pids-limit 256 --cpus 2 --env HOME=/tmp --workdir /tmp --env GOPATH=/tmp/go"
          echo "uid:gid $(id -u):$(id -g)"
          for REPO in go-chi/chi@c64ed7d6635f33a8b2feaff7dcfa55677023ac7d caddyserver/caddy@16618f454ca6f78f37dfd85a90573d8ffd43c1c8; do
            name=${REPO%@*}; sha=${REPO#*@}; R=$T/$(echo $name | tr / _); echo "######## $name"
            git init -q $R/target && git -C $R/target fetch -q --depth 1 "https://github.com/$name.git" "$sha" && git -C $R/target -c advice.detachedHead=false checkout -q FETCH_HEAD
            mkdir -p $R/stage $R/gomod $R/gomod-online $R/out; chmod 777 $R/gomod $R/gomod-online $R/out
            (cd $R/target && find . \( -name .git -o -name vendor \) -prune -o \( -name go.mod -o -name go.sum -o -name go.work -o -name go.work.sum \) -type f -print) | while read f; do mkdir -p "$R/stage/$(dirname "$f")"; cp "$R/target/$f" "$R/stage/$f"; done
            t0=$(date +%s)
            for m in $(cd $R/stage && find . -name go.mod -exec dirname {} \; | sort); do
              docker run $common --memory 2048m --memory-swap 2048m --env GOMODCACHE=/data/gomod --env GOTOOLCHAIN=local --env GOPROXY=https://proxy.golang.org --env GOFLAGS=-mod=mod --env 'GOVCS=*:off' \
                --mount type=bind,source=$R/stage,target=/data/stage,readonly --mount type=bind,source=$R/gomod,target=/data/gomod \
                --workdir /data/stage/$m --entrypoint go "$IMG" mod download > $T/dl.log 2>&1
              echo "DOWNLOAD $m exit=$? $(tail -c 200 $T/dl.log | tr '\n' ' ')"
            done
            echo "DOWNLOAD_S $(( $(date +%s)-t0 )) CACHE_MB $(du -sm $R/gomod | cut -f1)"
            scr() { mkdir -p $R/gc-$1/tmp; chmod -R 777 $R/gc-$1; echo "--mount type=bind,source=$R/gc-$1,target=/data/gocache --env GOCACHE=/data/gocache --env GOTMPDIR=/data/gocache/tmp"; }
            scan() { local n=$1; shift; local t0=$(date +%s)
              docker run $common --memory 2048m --memory-swap 2048m "$@" --mount type=bind,source=$R/target,target=/target,readonly --mount type=bind,source=$R/out,target=/out \
                "$IMG" -concurrency 1 -fmt json -out /out/$n.json -no-fail -track-suppressions /target/... > /dev/null 2> $T/$n.err
              echo "SCAN $n exit=$? s=$(( $(date +%s)-t0 )) SSA_SKIPS $(grep -c 'Error building the SSA' $T/$n.err) SCRATCH_MB $(du -sm $R/gc-$n 2>/dev/null | cut -f1)"
              grep -i 'permission denied\|operation not permitted' $T/$n.err | head -2; rm -rf $R/gc-$n; }
            mod="--mount type=bind,source=$R/gomod,target=/data/gomod,readonly --env GOMODCACHE=/data/gomod --env GOPROXY=off"
            scan offline --network none
            scan A --network none $mod
            scan Adisk --network none $mod $(scr Adisk)
            scan online $(scr online) --mount type=bind,source=$R/gomod-online,target=/data/gomod --env GOMODCACHE=/data/gomod
            python3 - "$R/out" <<'PY'
          import json, sys
          o = sys.argv[1]
          def load(n):
              d = json.load(open(f"{o}/{n}.json"))
              return {(i["rule_id"], i["file"], i["line"]) for i in d.get("Issues") or []}, len(d.get("Golang errors") or {})
          on = load("online")
          for n in ["online", "offline", "A", "Adisk"]:
              s, e = load(n)
              print(f"RESULT {n}: {len(s)} found, {len(on[0]-s)} missed, {len(s-on[0])} extra, {e} pkg errs")
          PY
          done
      - name: Q6 CA file, Keychain, and a proxy on the Mac's loopback
        run: |
          set -u +e
          T=$RUNNER_TEMP
          openssl req -x509 -newkey rsa:2048 -nodes -keyout $T/k.pem -out $T/ca.pem -days 1 -subj /CN=siegekit-throwaway-ca 2>/dev/null; chmod 644 $T/ca.pem
          base="--rm --pull never --user $(id -u):$(id -g) --cap-drop ALL --security-opt no-new-privileges --read-only --tmpfs /tmp:rw,nosuid,nodev,noexec,size=1024m --memory 2048m --memory-swap 2048m --cpus 2 --pids-limit 256 --env HOME=/tmp"
          CA="--mount type=bind,source=$T/ca.pem,target=/etc/siegekit-ca.pem,readonly --env SSL_CERT_FILE=/etc/siegekit-ca.pem"
          gm() { docker run $base --env GOPATH=/tmp/go --env GOTOOLCHAIN=local --env GOPROXY=https://proxy.golang.org --env 'GOVCS=*:off' "$@" --workdir /tmp --entrypoint go $IMG mod download -json github.com/google/uuid@v1.6.0 > $T/g.json 2>&1; echo "exit=$? $(grep -o '"Error": "[^"]*' $T/g.json | cut -c1-170)"; }
          echo "go mod download, extra CA mounted from the Mac: $(gm $CA)"
          mkdir -p $T/db; chmod 777 $T/db; t0=$(date +%s)
          docker run $base $CA --mount type=bind,source=$T/db,target=/tmp/trivy/db $TRIVY image --cache-dir /tmp/trivy --download-db-only --no-progress > $T/t.log 2>&1
          echo "trivy update, extra CA, DB on a Mac folder: exit=$? s=$(( $(date +%s)-t0 )) db_mb=$(du -sm $T/db | cut -f1) $(grep -E 'x509|FATAL' $T/t.log | cut -c1-160 | tail -1)"
          echo "--- Keychain"
          sudo security add-trusted-cert -d -r trustRoot -k /Library/Keychains/System.keychain $T/ca.pem; echo "add-trusted-cert exit=$?"
          echo "in System.keychain export: $(security find-certificate -a -c siegekit-throwaway-ca -p /Library/Keychains/System.keychain | grep -c BEGIN)"
          for f in /etc/ssl/cert.pem /usr/local/etc/openssl@3/cert.pem /usr/local/etc/ca-certificates/cert.pem; do [ -f $f ] && echo "in $f: $(openssl crl2pkcs7 -nocrl -certfile $f 2>/dev/null | openssl pkcs7 -print_certs -noout 2>/dev/null | grep -c siegekit-throwaway-ca)"; done
          echo "--- proxy on the Mac's 127.0.0.1"
          go build -o $T/cp ./.github/zz-connect-proxy && ($T/cp 127.0.0.1:3128 > $T/cp.log 2>&1 &) ; sleep 2
          curl -sS -o /dev/null -w "host curl via proxy: %{http_code}\n" -x http://127.0.0.1:3128 https://proxy.golang.org/
          for h in 127.0.0.1 host.lima.internal host.docker.internal 192.168.5.2; do echo "container HTTPS_PROXY=http://$h:3128: $(gm --env HTTPS_PROXY=http://$h:3128)"; done
          echo "proxy log: $(awk '{print $NF}' $T/cp.log | sort | uniq -c | tr '\n' ' ')"
