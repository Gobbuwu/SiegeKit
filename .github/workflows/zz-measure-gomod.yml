name: Measure Go module download (temporary)

# Temporary measurement for the Go module download design (1.0 item 6).
# Removed before merge. Round 4: every option of Q1 and Q2 in the pinned
# gosec image, on both engines and both CPU architectures, plus edge cases
# (go.work, vendor/, replace inside the repository).
#   offline  today's scan (no modules, 256 MiB /tmp)
#   A        Q1A modules (go mod download, GOVCS=*:off), 256 MiB /tmp (Q2A)
#   Atmp     Q1A modules, 2 GiB /tmp and 4 GiB memory (Q2C)
#   Adisk    Q1A modules, GOCACHE+GOTMPDIR in a scratch folder on disk (Q2B)
#   B        Q1B SiegeKit-fetched zips as a file proxy, extracted at scan time, Q2B scratch
#   C        Q1C the developer's own cache (go build ./... at the root), Q2B scratch
#   online   network on, Q2B scratch (the reference)
on:
  pull_request:
    paths:
      - .github/workflows/zz-measure-gomod.yml

permissions:
  contents: read

jobs:
  measure:
    name: ${{ matrix.repo }} (${{ matrix.engine }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        engine: [podman, docker]
        repo:
          - docker/awesome-compose@30f4b7f6a6c3b0c0ecf4d4efb0de203c48d11562
          - caddyserver/caddy@16618f454ca6f78f37dfd85a90573d8ffd43c1c8
          - spf13/cobra@adbc8813901bba65827259daa8e22ff94ec1f30e
          - gin-gonic/gin@0f09c3a9b4626d9fe9979cf4d0521d6ae32ab646
          - go-chi/chi@c64ed7d6635f33a8b2feaff7dcfa55677023ac7d
          - gotify/server@912af9f37414ab08fae0cfcc3941c4fd95c183aa
          - kubernetes/examples@22934a040acbb0c0aa103023ccbd871507bf17f6
          - pocketbase/pocketbase@7f2773ec234b62d0b80ca47c508397cb3d0da3ea
          - go-shiori/shiori@aebb4021a56048eed4c8feb325399be5f46e5470
          - traefik/whoami@1ce75d01b6978863647da42557a707a479da3a51
    env:
      E: ${{ matrix.engine }}
      REPO: ${{ matrix.repo }}
      IMG: ghcr.io/securego/gosec@sha256:7bcf1edbab3e80d8006a28d53e7031a9c9775be8eec30679e4adc1f51d272121
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Measure
        run: |
          set -u +e
          T=$RUNNER_TEMP
          echo "ARCH $(uname -m)"
          if [ "$E" = podman ]; then echo "rootless=$(podman info --format '{{.Host.Security.Rootless}}') cgroup=$(podman info --format '{{.Host.CgroupsVersion}}') $(podman --version)"; else echo "$(docker --version) cgroup=$(docker info --format '{{.CgroupVersion}}')"; fi
          $E pull -q "$IMG" > /dev/null
          echo "IMAGE: $($E run --rm --entrypoint go "$IMG" version) | $($E run --rm --entrypoint go "$IMG" env GOTOOLCHAIN GOPROXY GOFLAGS GOROOT GOPATH | tr '\n' ' ')"
          name=${REPO%@*}; sha=${REPO#*@}
          git init -q $T/target && git -C $T/target fetch -q --depth 1 "https://github.com/$name.git" "$sha" && git -C $T/target -c advice.detachedHead=false checkout -q FETCH_HEAD
          mkdir -p $T/stage $T/gomod $T/gomod-online $T/cmod $T/proxy $T/out; chmod 777 $T/gomod $T/gomod-online $T/cmod $T/out
          (cd $T/target && find . \( -name .git -o -name vendor \) -prune -o \( -name go.mod -o -name go.sum -o -name go.work -o -name go.work.sum \) -type f -print) | while read f; do mkdir -p "$T/stage/$(dirname "$f")"; cp "$T/target/$f" "$T/stage/$f"; done
          ro=--read-only; [ "$E" = podman ] && ro="--read-only --read-only-tmpfs=false"
          common="--rm --pull never --user $(id -u):$(id -g) --cap-drop ALL --security-opt no-new-privileges $ro --tmpfs /tmp:rw,nosuid,nodev,noexec,size=256m --tmpfs /dev/shm:rw,nosuid,nodev,noexec,size=64m --pids-limit 256 --memory 2048m --memory-swap 2048m --cpus 2 --env HOME=/tmp --workdir /tmp --env GOPATH=/tmp/go"
          # Q1A download: network, no target, module files only, GOVCS=*:off.
          t0=$(date +%s.%N)
          for m in $(cd $T/stage && find . -name go.mod -printf '%h\n' | sort); do
            $E run $common --env GOMODCACHE=/data/gomod --env GOTOOLCHAIN=local --env GOPROXY=https://proxy.golang.org --env GOFLAGS=-mod=mod --env 'GOVCS=*:off' \
              --mount type=bind,source=$T/stage,target=/data/stage,readonly --mount type=bind,source=$T/gomod,target=/data/gomod \
              --workdir /data/stage/$m --entrypoint go "$IMG" mod download > $T/dl.log 2>&1
            echo "DOWNLOAD $m exit=$? $(tail -c 300 $T/dl.log | tr '\n' ' ')"
          done
          echo "DOWNLOAD_S $(echo "$(date +%s.%N) - $t0" | bc) CACHE_BYTES $(sudo du -sb $T/gomod | cut -f1) ZIPS $(sudo find $T/gomod/cache/download -name '*.zip' 2>/dev/null | wc -l)"
          # Q1B fetch: SiegeKit-style, every go.sum entry, hash-checked, into a file proxy.
          echo "B_FETCH $(python3 -I .github/zz-fetchsum.py $T/target $T/proxy)"
          chmod -R a+rX $T/proxy
          # Q1C: the developer's cache after go build ./... at the root module (image's Go, network on).
          if [ -f $T/target/go.mod ]; then
            mkdir -p $T/cgc; chmod 777 $T/cgc
            $E run $common --env GOMODCACHE=/data/cmod --env GOCACHE=/data/cgc --env GOTOOLCHAIN=local --env GOFLAGS=-buildvcs=false \
              --mount type=bind,source=$T/target,target=/target,readonly --mount type=bind,source=$T/cmod,target=/data/cmod --mount type=bind,source=$T/cgc,target=/data/cgc \
              --workdir /target --entrypoint go "$IMG" build -o /dev/null ./... > $T/cbuild.log 2>&1
            echo "C_BUILD exit=$? $(tail -c 200 $T/cbuild.log | tr '\n' ' ')"; sudo rm -rf $T/cgc
          else echo "C_BUILD no root go.mod"; fi
          common2="--pull never --user $(id -u):$(id -g) --cap-drop ALL --security-opt no-new-privileges $ro --tmpfs /dev/shm:rw,nosuid,nodev,noexec,size=64m --pids-limit 256 --cpus 2 --env HOME=/tmp --workdir /tmp --env GOPATH=/tmp/go"
          small="--tmpfs /tmp:rw,nosuid,nodev,noexec,size=256m --memory 2048m --memory-swap 2048m"
          scr() { mkdir -p $T/gc-$1/tmp; chmod -R 777 $T/gc-$1; echo "--mount type=bind,source=$T/gc-$1,target=/data/gocache --env GOCACHE=/data/gocache --env GOTMPDIR=/data/gocache/tmp"; }
          scan() { local n=$1; shift; local t0=$(date +%s.%N)
            $E run --name m-$n $common2 "$@" --mount type=bind,source=$T/target,target=/target,readonly --mount type=bind,source=$T/out,target=/out \
              "$IMG" -concurrency 1 -fmt json -out /out/$n.json -no-fail -track-suppressions /target/... > /dev/null 2> $T/$n.err
            local code=$?
            echo "SCAN $n exit=$code s=$(echo "$(date +%s.%N) - $t0" | bc) oom=$($E inspect --format '{{.State.OOMKilled}}' m-$n) SSA_SKIPS $(grep -c 'Error building the SSA' $T/$n.err) NO_SPACE $(grep -c 'no space left' $T/$n.err) SCRATCH_BYTES $(sudo du -sb $T/gc-$n 2>/dev/null | cut -f1)"
            grep 'Error building the SSA' $T/$n.err | cut -c1-200 | sort | uniq -c | head -5
            $E rm m-$n > /dev/null; sudo rm -rf $T/gc-$n
            python3 -c "import json,sys; d=json.load(open('$T/out/$n.json')); e=d.get('Golang errors') or {}; [print('  ERR', k.replace('/target/',''), str(v[0].get('error'))[:160]) for k, v in list(e.items())[:3]]" || true; }
          mod="--mount type=bind,source=$T/gomod,target=/data/gomod,readonly --env GOMODCACHE=/data/gomod --env GOPROXY=off"
          scan offline --network none $small
          scan A --network none $mod $small
          scan Atmp --network none $mod --tmpfs /tmp:rw,nosuid,nodev,noexec,size=2048m --memory 4096m --memory-swap 4096m
          scan Adisk --network none $mod $small $(scr Adisk)
          scan B --network none $small $(scr B) --mount type=bind,source=$T/proxy,target=/data/proxy,readonly --env GOPROXY=file:///data/proxy --env GOSUMDB=off --env GOMODCACHE=/data/gocache/mod
          scan C --network none $small $(scr C) --mount type=bind,source=$T/cmod,target=/data/cmod,readonly --env GOMODCACHE=/data/cmod --env GOPROXY=off
          scan online $small $(scr online) --mount type=bind,source=$T/gomod-online,target=/data/gomod --env GOMODCACHE=/data/gomod
          python3 - "$T/out" <<'PY'
          import json, sys
          o = sys.argv[1]
          def load(n):
              d = json.load(open(f"{o}/{n}.json"))
              return {(i["rule_id"], i["file"], i["line"]) for i in d.get("Issues") or []}, len(d.get("Golang errors") or {}), d["Stats"]["files"]
          on = load("online")
          for n in ["online", "offline", "A", "Atmp", "Adisk", "B", "C"]:
              s, e, f = load(n)
              print(f"RESULT {n}: {len(s)} found, {len(on[0]-s)} missed, {len(s-on[0])} extra, {e} pkg errs, {f} files")
          PY

  edge:
    name: edge cases (${{ matrix.engine }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        engine: [podman, docker]
    env:
      E: ${{ matrix.engine }}
      IMG: ghcr.io/securego/gosec@sha256:7bcf1edbab3e80d8006a28d53e7031a9c9775be8eec30679e4adc1f51d272121
    steps:
      - name: Measure
        run: |
          set -u +e
          T=$RUNNER_TEMP
          $E pull -q "$IMG" > /dev/null
          ro=--read-only; [ "$E" = podman ] && ro="--read-only --read-only-tmpfs=false"
          common="--rm --pull never --user $(id -u):$(id -g) --cap-drop ALL --security-opt no-new-privileges $ro --tmpfs /tmp:rw,nosuid,nodev,noexec,size=256m --tmpfs /dev/shm:rw,nosuid,nodev,noexec,size=64m --pids-limit 256 --memory 2048m --memory-swap 2048m --cpus 2 --env HOME=/tmp --workdir /tmp --env GOPATH=/tmp/go --env GOTOOLCHAIN=local"
          gen() { local d=$1; shift; $E run $common --mount type=bind,source=$T/fx,target=/fx --workdir /fx/$d --entrypoint go "$IMG" "$@"; echo "GEN $d go $* exit=$?"; }
          mkdir -p $T/fx; chmod 777 $T/fx
          # Fixtures, synthetic: each has a G115 (an SSA rule) in a package that imports github.com/google/uuid,
          # so the finding appears only when the dependency type-checks.
          gofile() { cat > "$1" <<GO
          package $2

          import (
          	"os"

          	"github.com/google/uuid"$3
          )

          func $4() int16 {
          	n := len(os.Args) + len(uuid.NewString())$5
          	return int16(n)
          }
          $6
          GO
          }
          # 1. go.work with two modules (a uses b through the workspace).
          mkdir -p $T/fx/work/a $T/fx/work/b; chmod -R 777 $T/fx
          printf 'module example.com/a\n\ngo 1.24\n' > $T/fx/work/a/go.mod; printf 'module example.com/b\n\ngo 1.24\n' > $T/fx/work/b/go.mod
          gen work/a get github.com/google/uuid@v1.6.0; gen work/b get github.com/google/uuid@v1.6.0
          printf 'go 1.24\n\nuse (\n\t./a\n\t./b\n)\n' > $T/fx/work/go.work
          gofile $T/fx/work/a/main.go main '; b "example.com/b"' F ' + int(b.N())' 'func main() { _ = F() }'
          gofile $T/fx/work/b/b.go b '' N '' ''
          # 2. replace to a folder inside the repository.
          mkdir -p $T/fx/rep/sub; chmod -R 777 $T/fx
          printf 'module example.com/r\n\ngo 1.24\n' > $T/fx/rep/go.mod; printf 'module example.com/sub\n\ngo 1.24\n' > $T/fx/rep/sub/go.mod
          gen rep/sub get github.com/google/uuid@v1.6.0; gen rep get github.com/google/uuid@v1.6.0
          gen rep mod edit -require=example.com/sub@v0.0.0 -replace=example.com/sub=./sub
          gofile $T/fx/rep/main.go main '; sub "example.com/sub"' F ' + int(sub.N())' 'func main() { _ = F() }'
          gofile $T/fx/rep/sub/sub.go sub '' N '' ''
          # 3. vendor/ committed.
          mkdir -p $T/fx/ven; chmod -R 777 $T/fx
          printf 'module example.com/v\n\ngo 1.24\n' > $T/fx/ven/go.mod
          gen ven get github.com/google/uuid@v1.6.0
          gofile $T/fx/ven/main.go main '' F '' 'func main() { _ = F() }'
          gen ven mod tidy; gen ven mod vendor
          chmod -R a+rX $T/fx
          for f in $(find $T/fx -name '*.go' -not -path '*/vendor/*') $(find $T/fx -name 'go.mod' -o -name go.work | grep -v vendor); do echo "== $f"; cat $f; done
          for fx in work rep ven; do
            echo "### $fx"
            S=$T/s-$fx; G=$T/m-$fx; O=$T/o-$fx; mkdir -p $S $G $T/gmo-$fx $O; chmod 777 $G $T/gmo-$fx $O
            (cd $T/fx/$fx && find . \( -name .git -o -name vendor \) -prune -o \( -name go.mod -o -name go.sum -o -name go.work -o -name go.work.sum \) -type f -print) | while read f; do mkdir -p "$S/$(dirname "$f")"; cp "$T/fx/$fx/$f" "$S/$f"; done
            for m in $(cd $S && find . -name go.mod -printf '%h\n' | sort); do
              $E run $common --env GOMODCACHE=/data/gomod --env GOPROXY=https://proxy.golang.org --env GOFLAGS=-mod=mod --env 'GOVCS=*:off' \
                --mount type=bind,source=$S,target=/data/stage,readonly --mount type=bind,source=$G,target=/data/gomod \
                --workdir /data/stage/$m --entrypoint go "$IMG" mod download > $T/dl.log 2>&1
              echo "DOWNLOAD $fx/$m exit=$? $(tail -c 300 $T/dl.log | tr '\n' ' ')"
            done
            for v in offline A online; do
              mkdir -p $T/gc-$fx-$v/tmp; chmod -R 777 $T/gc-$fx-$v
              case $v in
                offline) x="--network none --env GOPROXY=off" ;;
                A) x="--network none --mount type=bind,source=$G,target=/data/gomod,readonly --env GOMODCACHE=/data/gomod --env GOPROXY=off" ;;
                online) x="--mount type=bind,source=$T/gmo-$fx,target=/data/gomod --env GOMODCACHE=/data/gomod" ;;
              esac
              $E run $common $x --mount type=bind,source=$T/gc-$fx-$v,target=/data/gocache --env GOCACHE=/data/gocache --env GOTMPDIR=/data/gocache/tmp \
                --mount type=bind,source=$T/fx/$fx,target=/target,readonly --mount type=bind,source=$O,target=/out \
                "$IMG" -concurrency 1 -fmt json -out /out/$v.json -no-fail /target/... > /dev/null 2> $T/err-$fx-$v
              echo "SCAN $fx $v exit=$? SSA_SKIPS $(grep -c 'Error building the SSA' $T/err-$fx-$v)"
              python3 -c "import json; d=json.load(open('$O/$v.json')); print('RESULT $fx $v', sorted((i['rule_id'], i['file'].replace('/target/',''), i['line']) for i in d.get('Issues') or []), 'pkgerrs', {k.replace('/target/',''): str(e[0].get('error'))[:120] for k, e in (d.get('Golang errors') or {}).items()})"
            done
          done
