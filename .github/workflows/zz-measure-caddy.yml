name: Trace caddy gosec variance (temporary)

# Temporary, removed before merge. Round 2: repeat runs of Q2's two fixes on
# caddy (the repository that varied 106 to 112 findings), 3 jobs x 3 scans
# per engine and option:
#   B  GOCACHE+GOTMPDIR in a fresh scratch folder on disk, 256 MiB /tmp, 2 GiB memory
#   C  2 GiB /tmp, 4 GiB memory
on:
  pull_request:
    paths:
      - .github/workflows/zz-measure-caddy.yml

permissions:
  contents: read

jobs:
  trace:
    name: caddy ${{ matrix.engine }} Q2${{ matrix.opt }} job ${{ matrix.attempt }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        engine: [podman, docker]
        opt: [B, C]
        attempt: [1, 2, 3]
    env:
      E: ${{ matrix.engine }}
      OPT: ${{ matrix.opt }}
      IMG: ghcr.io/securego/gosec@sha256:7bcf1edbab3e80d8006a28d53e7031a9c9775be8eec30679e4adc1f51d272121
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trace
        run: |
          set -u +e
          T=$RUNNER_TEMP
          $E pull -q "$IMG" > /dev/null
          git init -q $T/target && git -C $T/target fetch -q --depth 1 https://github.com/caddyserver/caddy.git 16618f454ca6f78f37dfd85a90573d8ffd43c1c8 && git -C $T/target -c advice.detachedHead=false checkout -q FETCH_HEAD
          mkdir -p $T/stage $T/gomod $T/out; chmod 777 $T/gomod $T/out
          cp $T/target/go.mod $T/target/go.sum $T/stage/
          ro=--read-only; [ "$E" = podman ] && ro="--read-only --read-only-tmpfs=false"
          base="--rm --pull never --user $(id -u):$(id -g) --cap-drop ALL --security-opt no-new-privileges $ro --tmpfs /dev/shm:rw,nosuid,nodev,noexec,size=64m --pids-limit 256 --cpus 2 --env HOME=/tmp --workdir /tmp --env GOPATH=/tmp/go"
          small="--tmpfs /tmp:rw,nosuid,nodev,noexec,size=256m --memory 2048m --memory-swap 2048m"
          $E run $base $small --env GOMODCACHE=/data/gomod --env GOTOOLCHAIN=local --env GOPROXY=https://proxy.golang.org --env GOFLAGS=-mod=mod --env 'GOVCS=*:off' \
            --mount type=bind,source=$T/stage,target=/data/stage,readonly --mount type=bind,source=$T/gomod,target=/data/gomod --workdir /data/stage --entrypoint go "$IMG" mod download
          echo "download exit=$?"
          for i in 1 2 3; do
            if [ "$OPT" = B ]; then
              mkdir -p $T/gc/tmp; chmod -R 777 $T/gc
              x="$small --mount type=bind,source=$T/gc,target=/data/gocache --env GOCACHE=/data/gocache --env GOTMPDIR=/data/gocache/tmp"
            else
              x="--tmpfs /tmp:rw,nosuid,nodev,noexec,size=2048m --memory 4096m --memory-swap 4096m"
            fi
            $E run $base $x --network none \
              --mount type=bind,source=$T/gomod,target=/data/gomod,readonly --env GOMODCACHE=/data/gomod --env GOPROXY=off \
              --mount type=bind,source=$T/target,target=/target,readonly --mount type=bind,source=$T/out,target=/out \
              --entrypoint sh "$IMG" -c 'gosec -concurrency 1 -fmt json -out /out/r.json -no-fail -track-suppressions /target/... >/dev/null 2>/out/err.txt; echo "gosec exit=$?"; echo "memory.peak $(cat /sys/fs/cgroup/memory.peak 2>&1) tmp_used $(du -sm /tmp 2>/dev/null | cut -f1)MiB"; cat /sys/fs/cgroup/memory.events 2>&1 | tr "\n" " "; echo'
            echo "scan $i: SSA_SKIPS $(grep -c 'Error building the SSA' $T/out/err.txt) NO_SPACE $(grep -c 'no space left' $T/out/err.txt) scratch $(sudo du -sm $T/gc 2>/dev/null | cut -f1)MiB"
            sudo rm -rf $T/gc
            python3 - "$T/out/r.json" .github/zz-caddy-ref.json $i <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          got = {(i["rule_id"], i["file"].replace("/target/", ""), int(str(i["line"]).split("-")[0])) for i in d.get("Issues") or []}
          ref = {tuple(x) for x in json.load(open(sys.argv[2]))}
          print(f"RESULT scan {sys.argv[3]}: {len(got)} found, {len(ref - got)} missed, {len(got - ref)} extra, {len(d.get('Golang errors') or {})} pkg errs")
          for x in sorted(ref - got): print("  MISSED", x)
          for x in sorted(got - ref): print("  EXTRA", x)
          PY
          done
